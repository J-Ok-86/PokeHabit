 width:min(100%,430px);height:calc(78px + var(--nav-safe));

/* v1.7.4 · Three instantly recognizable capture sequences: basic / advanced / premium.
   These styles never affect encounter randomness or prices. */
.tier-vfx-hint{display:flex;align-items:center;gap:6px;min-height:26px;padding:5px 9px;margin:10px 0 0;border-radius:9px;font-weight:900;font-size:12px;line-height:1.4;letter-spacing:.1px}

.tier-vfx-hint.plus{color:#b2eaff;background:#2486d733;border:1px solid #44b0ff55}
.tier-vfx-hint.premium{color:#ffe7a3;background:#b68a2930;border:1px solid #f8d57277}
.capture-modal{position:relative;isolation:isolate;--capture-accent:#ffbd84;--capture-soft:#fff5df}
.capture-modal.mode-basic{border-color:#e18a76;background:linear-gradient(165deg,#713c54,#302c51 45%,#101f32)}
.capture-modal.mode-plus{--capture-accent:#63ddff;--capture-soft:#c5f8ff;border-color:#41b9f2;background:linear-gradient(165deg,#124e82,#142e62 52%,#0a1936)}
.capture-modal.mode-premium{--capture-accent:#ffe49c;--capture-soft:#fff9d7;border:2px solid #e8bb5e;background:linear-gradient(165deg,#59307b,#2f245c 48%,#121331);box-shadow:0 25px 95px #000b,0 0 30px #e3b34b44}
.capture-modal .capture-head strong{color:var(--capture-accent);font-size:clamp(12px,2.7vw,15px);line-height:1.5}

.capture-tier-sign{display:flex;align-items:center;justify-content:center;gap:8px;font-size:14px;font-weight:950;letter-spacing:.4px;line-height:1.4;margin-top:9px;color:var(--capture-accent)}
.capture-tier-sign .tier-glyph{font-size:23px;filter:drop-shadow(0 2px 8px #ffffff66)}
.capture-modal.mode-premium .capture-tier-sign{font-size:17px;text-shadow:0 0 14px #ffe58e88}
.capture-arena{isolation:isolate}
.capture-arena.tier-basic{background:radial-gradient(circle at 68% 23%,#f4b97b88,transparent 32%),linear-gradient(180deg,#4b467f 0%,#916687 45%,#83635f 74%,#264846 100%);border-color:#d18b8a}
.capture-arena.tier-basic:before{background:radial-gradient(ellipse,#699359 11%,#346d62 56%,#1d4d52 80%)}
.capture-arena.tier-plus{background:radial-gradient(circle at 50% 33%,#44dfff88,transparent 36%),linear-gradient(180deg,#061943 0%,#123c7b 48%,#15628a 76%,#0b345f 100%);border-color:#52c8fb}
.capture-arena.tier-plus:before{background:radial-gradient(ellipse,#1789ba 10%,#15487a 58%,#0b244f 85%)}
.capture-arena.tier-premium{background:radial-gradient(circle at 50% 36%,#ffdfaa80,transparent 40%),radial-gradient(circle at 52% 54%,#bb6bfe58,transparent 62%),linear-gradient(180deg,#170d41 0%,#3d286b 48%,#59365e 70%,#1a213b 100%);border-color:#e5b866}
.capture-arena.tier-premium:before{background:radial-gradient(ellipse,#9573a6 9%,#51407c 51%,#261a50 83%)}
.capture-arena.tier-plus:after{background:repeating-radial-gradient(circle at 50% 44%,transparent 0 29px,#62daff13 30px 32px);opacity:.9}
.capture-arena.tier-premium:after{background:repeating-radial-gradient(circle at 50% 48%,transparent 0 36px,#ffe8a51c 38px 40px);opacity:.9}
.capture-arena.tier-plus .capture-starfield{background-size:38px 51px,76px 82px;opacity:.42;filter:hue-rotate(145deg)}
.capture-arena.tier-premium .capture-starfield{background-size:24px 27px,47px 61px;opacity:.68}
.capture-vfx-label{position:absolute;z-index:10;left:10px;top:9px;color:#fff;font-weight:950;font-size:12px;padding:6px 10px;border:1px solid #ffffff55;border-radius:30px;background:#0b193b88;text-shadow:0 1px 4px #000a;pointer-events:none}
.capture-rings{position:absolute;z-index:2;left:50%;top:47%;width:210px;height:210px;transform:translate(-50%,-50%);border:2px solid #84deff88;border-radius:50%;box-shadow:0 0 0 16px #77d9ff17,0 0 0 37px #75d6ff10,0 0 36px #61cfff66;opacity:0;pointer-events:none}
.tier-plus.phase-flight .capture-rings,.tier-plus.phase-shake .capture-rings{opacity:.75;animation:capture-pulse 1.2s ease-in-out infinite alternate}
.tier-plus.phase-success .capture-rings{opacity:1;animation:capture-pulse .7s ease-in-out infinite alternate}
.tier-premium .capture-rings{border:3px dashed #ffdf82a8;box-shadow:0 0 0 24px #ffdf7d0d,0 0 0 48px #dda3ff15,0 0 46px #ffcf73aa}
.tier-premium.phase-encounter .capture-rings,.tier-premium.phase-flight .capture-rings,.tier-premium.phase-shake .capture-rings,.tier-premium.phase-success .capture-rings{opacity:.88;animation:capture-crown-spin 9s linear infinite}
.capture-energy{position:absolute;z-index:2;pointer-events:none;inset:0;opacity:0;background:linear-gradient(117deg,transparent 30%,#b8f6ff55 48%,transparent 63%);transform:translateX(-105%)}
.tier-plus.phase-flight .capture-energy,.tier-plus.phase-shake .capture-energy{opacity:1;animation:capture-energy-sweep 1.7s linear infinite}
.tier-premium .capture-energy{background:conic-gradient(from 0deg at 50% 45%,transparent 0deg,#ffdf732f 38deg,transparent 73deg,#f3a1ff35 126deg,transparent 166deg,#ffdb9b25 231deg,transparent 270deg)}
.tier-premium.phase-flight .capture-energy,.tier-premium.phase-shake .capture-energy,.tier-premium.phase-success .capture-energy{opacity:.9;animation:capture-gold-rotate 8s linear infinite;transform:none}
.capture-motes{position:absolute;z-index:4;inset:0;pointer-events:none;opacity:0;font-size:23px;color:#ffe7a5;text-shadow:0 0 14px #f9d65f}
.capture-motes span{position:absolute;display:block;will-change:transform}
.capture-motes span:nth-child(1){top:22%;left:16%}.capture-motes span:nth-child(2){top:15%;left:69%}.capture-motes span:nth-child(3){top:65%;left:12%}.capture-motes span:nth-child(4){top:61%;left:82%}.capture-motes span:nth-child(5){top:36%;left:80%}.capture-motes span:nth-child(6){top:77%;left:38%}
.tier-plus .capture-motes{color:#a8f8ff;text-shadow:0 0 15px #4acbfa}
.tier-plus.phase-flight .capture-motes,.tier-plus.phase-shake .capture-motes,.tier-plus.phase-success .capture-motes{opacity:.9;animation:capture-float 1.7s ease-in-out infinite alternate}
.tier-premium.phase-encounter .capture-motes,.tier-premium.phase-flight .capture-motes,.tier-premium.phase-shake .capture-motes,.tier-premium.phase-success .capture-motes{opacity:1;animation:capture-float 1.4s ease-in-out infinite alternate}
.tier-plus .capture-ball{background:linear-gradient(180deg,#2777df 0 43%,#14273f 43% 55%,#f7fcff 55% 100%);border-color:#b8eaff;box-shadow:inset 0 3px 9px #d5faff7d,0 0 20px #6cd6ff99,0 12px 25px #060e2c8a}
.tier-plus .capture-ball:before{background:linear-gradient(180deg,#061d49,#206db9)}
.tier-plus .capture-ball:after{border-color:#2f73ca;background:radial-gradient(circle,#fff 0 32%,#9aefff 40%,#2580ff 100%);box-shadow:0 0 12px #98eeff}
.tier-premium .capture-ball{border-color:#f2d887;background:linear-gradient(180deg,#5a3379 0 42%,#e7bb68 42% 55%,#191c37 55% 100%);box-shadow:inset 0 3px 10px #ffffff60,0 0 23px #ffd978c7,0 0 45px #d990e055,0 12px 25px #030513ab}
.tier-premium .capture-ball:before{background:linear-gradient(180deg,#fef2bf,#a97125)}
.tier-premium .capture-ball:after{border-color:#d0a352;background:radial-gradient(circle,#fff 0 28%,#ffeaa1 33%,#c788e3 71%,#5a327e 100%);box-shadow:0 0 18px #f9cf84}
.tier-plus.phase-flight .capture-ball{animation:capture-blue-flight 1.32s cubic-bezier(.16,.3,.53,.9) both}
.tier-plus.phase-shake .capture-ball{animation:capture-blue-shake 2.3s .14s ease-in-out both}
.tier-premium.phase-flight .capture-ball{animation:capture-gold-flight 1.7s cubic-bezier(.23,.18,.38,.95) both}
.tier-premium.phase-shake .capture-ball{animation:capture-gold-shake 2.8s .17s ease-in-out both}
.tier-plus.phase-flight .capture-impact,.tier-plus.phase-shake .capture-burst{filter:drop-shadow(0 0 18px #46cfff);background:radial-gradient(circle,#fff,#79dcff 30%,#326bff66 60%,transparent 74%)}
.tier-premium.phase-flight .capture-impact,.tier-premium.phase-shake .capture-burst{filter:drop-shadow(0 0 27px #ffe4a6);background:radial-gradient(circle,#fff,#ffefb4 20%,#efb2ff88 51%,transparent 74%)}
.tier-plus.phase-success .capture-burst{background:radial-gradient(circle at 50% 60%,#72eaff88,transparent 55%)}
.tier-premium.phase-success .capture-burst{background:radial-gradient(circle at 50% 60%,#ffe19b9f,#dca2ff33 39%,transparent 65%)}
.capture-modal.mode-plus .capture-status.highlight{color:#b6f6ff}
.capture-modal.mode-premium .capture-status.highlight{color:#ffebaa;font-size:20px;text-shadow:0 0 18px #e9b36b}
.capture-modal .capture-head button{min-height:37px}
.capture-theme-note{font-size:11px;line-height:1.4;opacity:.85;margin:1px 0 4px;color:#d7def0}
@keyframes capture-pulse{from{transform:translate(-50%,-50%) scale(.83);filter:brightness(.8)}to{transform:translate(-50%,-50%) scale(1.12);filter:brightness(1.4)}}
@keyframes capture-crown-spin{from{transform:translate(-50%,-50%) rotate(0)}to{transform:translate(-50%,-50%) rotate(360deg)}}
@keyframes capture-energy-sweep{0%{transform:translateX(-105%)}100%{transform:translateX(110%)}}
@keyframes capture-gold-rotate{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}
@keyframes capture-float{0%{transform:translateY(8px) scale(.85)}100%{transform:translateY(-10px) scale(1.15)}}
@keyframes capture-blue-flight{0%{opacity:1;transform:translate(165px,90px) scale(.55) rotate(60deg)}30%{transform:translate(90px,-140px) scale(.86) rotate(250deg)}55%{transform:translate(-52px,-90px) scale(1.05) rotate(420deg)}80%{transform:translate(-14px,-185px) scale(.72) rotate(580deg)}100%{transform:translate(0,-118px) scale(.43) rotate(700deg)}}
@keyframes capture-blue-shake{0%{transform:translateY(-130px) scale(.62)}19%{transform:translateY(0) scale(1.15)}27%{transform:rotate(-29deg)}39%{transform:rotate(25deg)}50%{transform:rotate(-20deg)}63%{transform:rotate(22deg)}74%{transform:rotate(-15deg)}87%{transform:rotate(11deg)}100%{transform:rotate(0)}}
@keyframes capture-gold-flight{0%{opacity:1;transform:translate(0,105px) scale(.4) rotate(0)}24%{transform:translate(-92px,-90px) scale(.85) rotate(180deg)}48%{transform:translate(95px,-145px) scale(1.05) rotate(360deg)}76%{transform:translate(-15px,-210px) scale(.75) rotate(610deg)}100%{transform:translate(0,-118px) scale(.45) rotate(900deg)}}
@keyframes capture-gold-shake{0%{transform:translateY(-150px) scale(.65);filter:brightness(2)}19%{transform:translateY(0) scale(1.12)}25%{transform:rotate(-18deg) scale(1.04)}34%{transform:rotate(17deg)}43%{transform:rotate(-16deg)}53%{transform:rotate(14deg)}62%{transform:rotate(-13deg)}71%{transform:rotate(12deg)}81%{transform:rotate(-8deg)}91%{transform:rotate(6deg)}100%{transform:rotate(0)}}
@media(max-height:480px) and (orientation:landscape){.capture-arena{height:clamp(170px,40dvh,230px)}.capture-modal{max-height:calc(100dvh - 10px);padding:8px 12px}.capture-tier-sign{margin-top:3px}.capture-status{margin:5px 0 2px;min-height:30px}.capture-tiny{margin:2px 0 5px}}
@media(prefers-reduced-motion:reduce){.capture-arena .capture-energy,.capture-arena .capture-rings,.capture-arena .capture-motes,.capture-arena .capture-motes span{animation:none!important}.capture-arena.phase-success .capture-rings,.capture-arena.phase-success .capture-motes{opacity:.8}.capture-arena .capture-energy{opacity:0!important}}

/* v1.7.4: child-first home: one compact ID section + strongly emphasized quest area. */
.home-id-panel,.home-quest-section{min-width:0;overflow-wrap:anywhere}
.home-id-panel{border:1px solid #557196;border-radius:21px;background:linear-gradient(140deg,#192e52,#202d50);padding:14px 15px 15px;margin:4px 0 16px;box-shadow:0 6px 18px #0310223a}
.home-id-heading{display:flex;align-items:center;justify-content:space-between;gap:8px;color:#c8dcfa;font-size:calc(12px * var(--app-scale,1.15));font-weight:900;margin-bottom:10px}
.home-id-handle{color:#9fc7e9;font-size:calc(10px * var(--app-scale,1.15));min-width:0;overflow:hidden;text-overflow:ellipsis}
.home-id-identity{display:flex;align-items:center;gap:10px;min-width:0}

.home-id-owner>strong{font-size:calc(17px * var(--app-scale,1.15));font-weight:1000;line-height:1.2;overflow-wrap:anywhere}
.home-id-rank{color:#ffd77b;font-size:calc(12px * var(--app-scale,1.15));font-weight:900}
.home-id-owner>small{color:#bacfe9;font-size:calc(10px * var(--app-scale,1.15))}
.home-id-rank-button{flex-shrink:0;background:#2e4971;border:1px solid #6383ad;border-radius:10px;padding:8px;min-height:40px;color:#e8f3ff;font-size:calc(11px * var(--app-scale,1.15));font-weight:900}
.home-id-exp{margin-top:11px;padding-top:11px;border-top:1px solid #ffffff29}
.home-id-exp-header{display:flex;justify-content:space-between;gap:7px;align-items:center;font-size:calc(12px * var(--app-scale,1.15));font-weight:900}

// Weighted interpolation between configurable 5-level gift curve control points.
function giftMixForLevel(level){
 const curve=data.rules?.giftCurve||DEFAULT_GIFT_CURVE(),lev=Math.max(5,Number(level)||5);
 if(lev<=curve[0].level)return [...curve[0].weights];
 for(let i=1;i<curve.length;i++)if(lev<=curve[i].level){
  const lo=curve[i-1],hi=curve[i],u=(lev-lo.level)/(hi.level-lo.level);
  return lo.weights.map((w,j)=>w+(hi.weights[j]-w)*u);
 }
 return [...curve[curve.length-1].weights];
}
function giftRarityProb(level){const mix=giftMixForLevel(level);return RARITIES.map((r,i)=>TIERS.reduce((sum,t,j)=>sum+mix[j]*probFor(t)[i]/100,0));}

}).join('')}
function grantMilestonePokemon(level){

 const pool=pools[rarity];if(!pool?.length)return null;
 const id=pool[ri(0,pool.length-1)],already=!!data.owned[id];
 const at=new Date().toISOString(),giftId=`milestone_${level}`;
 data.owned[id]={count:(data.owned[id]?.count||0)+1,firstDate:data.owned[id]?.firstDate||day()};
 const gift={level,id,rarity,at,giftId,new:!already,giftWeights:[...weights],giftProb:[...prob]};
 data.levelGifts.push(gift);

function importQuests(scope){
 if(!startUnlocked||!currentUserId||modal?.type!=='questImport'||modal.authorized!==true||!['all','selected'].includes(scope))return;
 const destinationId=currentUserId,sourceId=modal.sourceId;
 const source=registry.users[sourceId],destination=registry.users[destinationId];
 if(!source||sourceId===destinationId||!destination||destination.data!==data){alert('계정 정보를 다시 확인해 주세요.');return;}
 const existing=new Set(data.quests.map(questImportKey));
 const checked=new Set([...document.querySelectorAll('#questImportList input[name="selectedQuest"]:checked')].map(x=>x.value));
 const sourceList=source.data.quests||[],unique=[],keys=new Set(),skipped=[];
 for(const q of sourceList){
  if(scope==='selected'&&!checked.has(q.id))continue;
  const key=questImportKey(q);
  if(existing.has(key)||keys.has(key)){skipped.push(q.title);continue;}
  unique.push(q);keys.add(key);
 }
 if(!unique.length){alert(scope==='selected'&&!checked.size?'가져올 퀘스트를 체크하세요.':'가져올 새로운 퀘스트가 없습니다. 같은 이름·카테고리·목표의 항목은 중복으로 복사하지 않습니다.');return;}
 const freeSlots=30-data.quests.length;
 if(unique.length>freeSlots){alert('퀘스트는 계정당 최대 30개입니다. 현재 빈 자리 '+freeSlots+'개, 가져올 항목 '+unique.length+'개입니다. 선택 수를 줄이거나 기존 퀘스트를 정리해 주세요. 아직 아무것도 복사하지 않았습니다.');return;}
 const missingCategories=[];
 for(const q of unique){
  if(data.categories.some(c=>c.name===q.category)||missingCategories.some(c=>c.name===q.category))continue;
  const from=source.data.categories?.find(c=>c.name===q.category);
  missingCategories.push({name:String(q.category||'기타').slice(0,25),emoji:String(from?.emoji||icons[q.category]||'✨').slice(0,12)});
 }
 if(data.categories.length+missingCategories.length>100){alert('가져오기에는 추가 카테고리가 필요하지만, 카테고리 최대 100개를 넘습니다. 기존 카테고리를 정리한 다음 다시 진행하세요.');return;}
 const summary='@'+sourceId+' → @'+destinationId+'\n새 퀘스트 '+unique.length+'개 가져오기'+(skipped.length?'\n중복 '+skipped.length+'개 제외':'')+'\n\n기존 퀘스트와 완료 기록은 유지됩니다. 진행할까요?';
 if(!confirm(summary))return;
 // Generate new IDs and audit entries; never mutate the source account or transfer its records.
 const usedIds=new Set(data.quests.map(q=>q.id));
 for(const cat of missingCategories){
  data.categories.push(cat);
  data.categoryEvents.push({at:isoNow(),action:'create',before:'',after:cat.name,emoji:cat.emoji});
 }
 for(const q of unique){
  let id;do{id='copy_'+randomId().replace(/-/g,'')}while(usedIds.has(id));usedIds.add(id);
  const copy={id,title:String(q.title).slice(0,45),category:String(q.category||'기타').slice(0,25),goal:String(q.goal||'').slice(0,90),limitMinutes:Math.min(240,Math.max(1,Number(q.limitMinutes)||10)),rewardOverride:cleanQuestReward(q.rewardOverride),xpOverride:cleanQuestXp(q.xpOverride)};
  data.quests.push(copy);auditQuest('import',id,null,copy);
 }
 const persisted=save();modal=null;render();
 alert('✅ '+unique.length+'개 퀘스트를 가져왔습니다.'+(skipped.length?'\n중복 '+skipped.length+'개는 제외했습니다.':'')+(settings.autoSave&&!persisted?'\n⚠ 자동 저장이 실패했습니다. JSON Save로 즉시 백업해 주세요.':!settings.autoSave?'\n⚠ 자동 저장이 꺼져 있습니다. JSON Save로 백업해 주세요.':''));
}

const clampPercent=v=>Math.max(0,Math.min(100,Number(v)||0));
function normalizedFromRaw(values){
 const positive=values.map(x=>Math.max(0,Number(x)||0)),sum=positive.reduce((a,b)=>a+b,0);
 if(sum<0.0000001)return [100,0,0,0];
 const r=positive.slice(0,3).map(x=>Math.round(x/sum*10000)/100);
 return [...r,Math.round((100-r.reduce((a,b)=>a+b,0))*100)/100];
}
function draftOddsTable(){

}

 }).join('');

function oddsQuickAdjust(mode){
 if(!adminUnlocked||screen!=='manual')return;
 const form=document.getElementById('oddsEditor');if(!form)return;
 if(mode==='defaults'&&!confirm('등장·포획 확률 입력값을 추천 초기값으로 되돌릴까요? 실제 저장은 저장 버튼을 눌렀을 때만 적용됩니다.'))return;
 const draft=draftOddsTable();
 for(const [i,t] of TIERS.entries()){
  const current=draft[t.id],def=DEFAULT_RULES().tiers[t.id];let p=[...current.prob],c=[...current.catch];
  if(mode==='defaults'){p=[...def.prob];c=[...def.catch]}
  else if(mode==='gap'){
   // Tighten basic-ball common bias and raise premium-ball rare+ distribution.
   const moves=[[3,-1.5,-1.1,-.4],[-1,.5,.3,.2],[-4,0,2,2]][i];
   p=normalizedFromRaw(p.map((v,j)=>v+moves[j]));
   c=c.map((v,j)=>clampPercent(v+([[-2,-3,-4,-4],[0,0,0,0],[0,1,2,3]][i][j])));
  }else{
   const change=mode==='up'?3:-3;
   const w=[[-change,change*.5,change*.35,change*.15]][0];
   p=normalizedFromRaw(p.map((v,j)=>v+w[j]));c=c.map(v=>clampPercent(v+change));
  }
  p.forEach((v,j)=>form.elements[`${t.id}_prob_${j}`].value=Number(v.toFixed(2)));
  c.forEach((v,j)=>form.elements[`${t.id}_catch_${j}`].value=Number(v.toFixed(2)));
 }
 updateOddsSummary();
}

function updateGiftSummary(){

  const level=Number(f.elements[`giftLevel_${i}`].value),weights=TIERS.map((_,j)=>Number(f.elements[`giftWeight_${i}_${j}`].value));

<p><b>오늘·뽑기·도감·달력·기록</b> 상단의 ID·성장 패널은 동일한 구조·높이·글자 크기를 사용합니다. Lv 뒤에는 실제 직급명을 표시합니다. 카드에는 🪙 현재 포인트, 📖 도감 완성률(고유 포켓몬 수÷151×100, 소수점 한 자리), ✅ 오늘 완료/전체가 함께 표시됩니다. 뽑기 탭에서는 포인트 카드, 도감 탭에서는 완성률 카드의 색상과 테두리만 강조하며 크기는 바뀌지 않습니다. 숫자 변경 후에도 같은 크기를 유지합니다.</p>
<p><b>오늘의 추천</b>은 매일 계정별로 최대 1개를 고정합니다. 오늘 미완료인 등록 퀘스트 중 <b>수행한 적 없는 퀘스트를 우선</b> 추천하고, 모두 수행한 적이 있으면 <b>마지막 수행일이 가장 오래된 퀘스트</b>를 선택합니다. 동률일 때 먼저 생성한 퀘스트를 추천합니다. 추천을 완료해도 같은 날 다른 퀘스트로 넘어가지 않으며, 하루 보너스를 여러 번 받을 수 없습니다. 포인트·경험치 각각 <b>+10%</b>를 완료 PIN 승인 시 적용하고, 추천 항목에 별도 배너·테두리·이펙트를 표시합니다.</p>
<p><b>추천 보상 계산식:</b> 기본 포인트 P₀, 시간 배수 T, 퀘스트 연속 배수 S, 관리자 포인트 상한 C: P₁=round(P₀×T), P₂=round(P₀×min(C,T×S)). 전체 연속 XP 배수 X: X₂=round(XP₀×X). 추천 퀘스트라면 P₃=round(P₂×1.10), X₃=round(X₂×1.10), 그렇지 않으면 P₃=P₂, X₃=X₂. FEVER ON 시간대라면 P₄=round(P₃×1.10), X₄=round(X₃×1.10), 아니면 P₄=P₃, X₄=X₃. <b>round는 양의 수에서 소수 첫째 자리 반올림</b>입니다. 기존 최종 포인트 배수 상한 C는 시간×연속 보상에 적용하고, 추천 및 FEVER 추가 보너스는 그 다음에 적용합니다. 추천·FEVER 중복 적용을 허용합니다. 정산과 보상 지급은 완료 PIN 인증 시 한 번만 진행하고, 화면 효과는 지급액을 바꾸지 않습니다.</p>
<p><b>기록 탭</b>에는 한 줄 설명을 추가하고 최근 뽑기 및 퀘스트 수정·삭제 이력을 접고 펼칠 수 있으며, 열림 상태는 계정별로 저장됩니다. 달력의 퀘스트 이력은 내부 퀘스트 ID를 보여주지 않고 완료 시각·목표·포인트·XP·추천 보너스 여부를 읽기 쉽게 표시합니다. 원본 기록과 JSON 계보는 유지합니다.</p></section><section class="manual-section" id="m-reward-show"><h3>🎬 단계별 보상 점수 상승 이펙트 (v1.7.7)</h3><p>퀘스트 완료 비밀번호를 확인하는 순간 포인트·XP 지급액은 <b>한 번만 확정하고 JSON에 기록</b>합니다. 완료 팝업에는 기본 랜덤 P와 기본 XP부터 보여주고 ①시간 배수 ②퀘스트별 연속 포인트 / 전체 연속 XP ③FEVER 추가 보상을 순서대로 표시하면서 실제 숫자를 올립니다. 실제 추가 보상이 있는 단계만 강조·빛 파동·파티클·점수 카운트업·획득 차이 표시가 발동합니다. FEVER 단계는 보라·주황색 특별 이펙트를 터뜨립니다. <b>연출은 실지급을 바꾸지 않습니다.</b> 건너뛰기를 누르면 <b>최종 지급액으로 즉시 이동</b>합니다. 화면 연출은 지급액을 재계산하거나 다시 지급하지 않습니다.</p><p><b>계산 예시:</b> 기본 100P, 시간 ×2.00, 퀘스트 연속 ×1.10, 기본 XP 25, 전체 연속 ×1.08, FEVER ON이면 시간 200P → 연속 220P → FEVER 242P, XP 25 → 연속 round(25×1.08)=27XP → FEVER round(27×1.1)=30XP입니다.</p></section>
<section class="manual-section" id="m-fever-formula"><h3>✨ FEVER TIME 보상 공식과 시간 판정</h3><p><b>관리자 → 계정별 FEVER TIME</b>에서 트레이너 각각 ON/OFF와 시작 시각을 지정합니다. 시작부터 정확히 60분 동안 유효하며 자정 넘김도 허용합니다. <b>기본값 ON · 20:00~21:00</b>, 할증율은 P·XP 모두 <b>10%</b>로 고정됩니다. 버튼을 눌러 타임챌린지를 끝낸 시간이 아니라, <b>완료 비밀번호 승인 시점</b>의 기기 현지 시각을 기준으로 합니다.</p><p>분 단위 판정: 현재 분 m=시×60+분, 시작 분 s=시×60+분, e=(m−s+1440)%1440. FEVER ON 그리고 0≤e＜60이면 적용됩니다.<br><b>포인트:</b> A=round(P₀×min(C,T×Bₚ)), P=FEVER 시 round(A×1.10), 아니면 A.<br><b>경험치:</b> X=round(X₀×Bₓ), XP=FEVER 시 round(X×1.10), 아니면 X.<br>P₀=랜덤 기본 포인트, C=관리자 최종 포인트 상한, T=시간 배수, Bₚ=퀘스트별 연속 포인트 배수, X₀=기본 퀘스트 XP, Bₓ=전체 연속 도전 XP 배수. <b>상한 C를 적용한 뒤 FEVER 10%를 별도로 추가</b>합니다. 원 단위 P·XP는 매 단계 일반적인 JS Math.round로 반올림합니다. 하루 전체 퀘스트 달성 고정 보너스 및 레벨 보상은 FEVER 할증 대상이 아닙니다.</p><p>FEVER 효과는 해당 계정이 로그인한 동안 전체 배경에 반짝이는 광채와 상단 상태 표시로 나타납니다. '동작 줄이기'가 활성화되면 반짝임 애니메이션을 끕니다. 기기가 절전으로 페이지를 멈추거나 시간이 변경되어도 화면 복귀 및 12초 주기 확인 시 업데이트됩니다. 실제 보상 판정은 승인 순간에 별도 계산합니다.</p></section>
<section class="manual-section"><h3>🌞 매일 이름을 부르는 응원 문구 (v1.7.4)</h3><p>홈에는 로그인 계정의 <b>표시 이름</b>을 크게 표시합니다. 날짜와 사용자 ID를 사용해 24가지 문구를 개인별로 섞어서 하루 한 문구를 고릅니다. 새로고침해도 그날은 같은 문구이며, 같은 24일 주기 내 중복이 없습니다. 이름은 관리자 → 사용자 계정 관리에서 수정합니다.</p><details><summary>24개 문구 모두 보기</summary><ol>${DAILY_QUOTES.map(q=>`<li>${esc(q)}</li>`).join('')}</ol></details></section><section class="manual-section"><h3>🎨 오늘 퀘스트 완료 상태 색상 (v1.7.4)</h3><p><b>오늘 미완료</b> 퀘스트는 연한 붉은 배경·테두리로 강조하고, <b>오늘 완료</b> 퀘스트는 초록색으로 표시합니다. 타임챌린지를 시작했어도 완료 전까지는 미완료 색상입니다. 카드형·큰 카드형·상세 목록·간편 리스트, 밝은/어두운 스킨에서 같은 기준으로 표시됩니다. 색상은 표시만 변경하며 기록·포인트에는 영향을 주지 않습니다.</p></section><section class="manual-section"><h3>🌟 v1.7.4 단계별 XP · 초과 경험치 이월</h3><p><b>다음 레벨에 필요한 경험치 = 현재 레벨 × 120 XP</b>입니다. 예: Lv.1→2 = 120XP, Lv.2→3 = 240XP, Lv.3→4 = 360XP, Lv.4→5 = 480XP. 달성하면 <b>초과 XP는 다음 레벨로 전액 이월</b>됩니다. 여러 레벨을 넘긴 경우 달성한 레벨의 보상도 각각 한 번씩 처리됩니다. 이미 획득한 포켓몬·레벨 보상·퀘스트·포인트는 그대로 유지되고, 기존 사용자는 이전 버전의 현재 레벨과 진행 XP를 새 기준으로 옮깁니다. 5레벨 무료 포켓몬 증정 및 레벨업 포인트 직접 수령 규칙은 바뀌지 않습니다.</p></section><section class="manual-section" id="m-dex-pinch"><h3>👐 도감 카드형 두 손가락 줌 · 이미지 우선 (v1.7.4)</h3><p><b>카드형 보기</b>에서는 도감 위에서 <b>두 손가락을 오므리면 열 수가 늘어</b> 더 많은 포켓몬을 한 화면에 보여주며, <b>벌리면 열 수가 줄어</b> 사진을 크게 보여줍니다. 한 손가락 스크롤과 포켓몬 한 번 터치(상세 정보)는 유지됩니다. 브라우저 화면 전체가 아니라 <b>도감 카드 영역만</b> 변경됩니다. 핀치 동작이 어려우면 <b>− / ＋ 버튼이나 열 개수 슬라이더</b>를 사용하세요.</p><p><b>기본값:</b> 휴대폰 3열 (2~8열), 갤럭시 탭·넓은 화면 6열 (3~12열). 700px 이상의 화면 너비를 태블릿형 배치로 간주합니다. 두 기기 유형의 설정은 현재 계정에 <b>각각 독립 저장</b>되며, JSON Save/Load와 계정별 병합에도 포함됩니다.</p><p><b>겹침 방지:</b> 포켓몬 그림의 공간을 먼저 확보하고 글자는 그림 아래 일반 흐름으로 배치합니다. 카드가 좁아지면 <b>포획 횟수와 등급 → 이름 → 번호</b> 순으로 글자를 숨겨서 겹치지 않게 하며, 가장 좁은 카드에는 <b>그림만</b> 남습니다. 긴 이름은 최대 두 줄이며 공간 부족 시 상세 화면에서 전체 정보를 확인할 수 있습니다. 큰 그림/목록형은 기존의 레이아웃을 유지합니다.</p></section><section class="manual-section"><h3>👥 트레이너 성장 비교 및 도감 상세 보기 (v1.7.4)</h3><p><b>상단 👥 사용자 성장</b>에서 모든 활성 계정의 <b>트레이너 직급 아이콘·직급명·레벨·도감 수집 수·퀘스트 완료 횟수</b>를 확인합니다. 도감 보기를 누르면 해당 계정의 포켓몬을 읽기 전용으로 비교할 수 있습니다. 직급은 계정별 현재 레벨로 계산하며 상대방의 데이터는 변경되지 않습니다.</p><p>도감과 다른 트레이너의 도감 모두 <b>카드형·큰 그림형·목록형</b>을 지원합니다. 포켓몬을 터치하거나 키보드로 선택하면 <b>상세 정보(큰 그림, 포획 횟수, 첫 획득일, 최근 포획·조우)</b> 창이 열립니다. 미획득 포켓몬은 이름을 가려서 표시합니다. 목록형에서는 좁은 휴대폰에서도 이미지·이름·번호·등급을 겹치지 않게 배치합니다. 외부 그림을 불러올 수 없는 경우에는 고스톱 그림 대신 몬스터볼 기호가 표시됩니다.</p></section>
<section class="manual-section"><h3>🧭 5개 탭 공통 성장 상태바</h3><p><b>오늘·뽑기·도감·달력·기록</b> 탭 모두 홈과 같은 상단 메뉴 버튼 배치를 유지하며, 화면 위에 <b>🌟 현재 레벨·직급·경험치, 🪙 현재 포인트, 📖 도감 완성률, ✅ 오늘 퀘스트 완료/전체</b>를 똑같은 구조로 표시합니다. 완료 즉시 숫자가 갱신되고 다음 날에는 그날 완료 횟수로 다시 계산됩니다. 이전처럼 다른 탭의 헤더 오른쪽에 포인트를 작게 표시하지 않습니다.</p><p><b>뽑기 탭의 포인트</b>는 실제 사용할 잔액이 중요하므로 숫자 크기와 색 대비를 더 강조했습니다. 몬스터볼을 뽑은 직후에도 잔액이 최신으로 갱신됩니다. 달력에서 포켓몬 뽑기 기록은 작은 노란색 피카츄 스타일 그림으로 구분합니다.</p></section><section class="manual-section"><h3>🎬 뽑기 단계별 포획 이펙트 (v1.7.4)</h3><p><b>일반 뽑기</b>는 초원·빨간 몬스터볼과 기본 흔들림, <b>고급 뽑기</b>는 푸른 번개·에너지 링과 파란 몬스터볼, <b>프리미엄 뽑기</b>는 황금 오라·회전 별빛과 황금 몬스터볼을 표시합니다. 단계별로 볼의 궤적·흔들림·결과 빛 연출 및 재생 길이가 다릅니다.</p><p>화면의 <b>연출 건너뛰기</b>로 결과를 바로 볼 수 있고, 기기의 동작 줄이기 설정이 켜져 있으면 애니메이션 없이 결과를 표시합니다. <b>모든 등급·포켓몬·포획 성공 결과와 포인트 지불은 연출 전에 결정 및 저장</b>되므로 이펙트는 포켓몬 등장 확률·포획 성공률·포인트 가격·기존 도감 기록에 전혀 영향을 주지 않습니다. 진행 중 앱 종료 시에도 미확인 결과를 다시 확인할 수 있습니다.</p></section><section class="manual-section"><h3>📥 다른 계정 퀘스트 가져오기 (v1.7.4)</h3><p><b>오늘 → 다른 계정 퀘스트 가져오기</b>를 누르고 관리자 비밀번호로 승인합니다. 가져올 계정을 고른 뒤 <b>전체 가져오기</b> 또는 체크한 <b>선택 항목 가져오기</b>를 사용할 수 있습니다. 가져오기 대상은 <b>현재 로그인한 계정</b>이며, 다른 계정은 원본으로만 사용합니다.</p><p>퀘스트의 <b>이름·목표·카테고리와 아이콘·타임챌린지 제한시간·개별 포인트 범위·개별 XP</b>만 복사합니다. 퀘스트 ID는 새로 만들므로 서로 독립적으로 수정할 수 있고, 기존 퀘스트·진행 중 타이머·완료 이력·포인트·XP·레벨·도감·로그인/완료 비밀번호는 복사하거나 변경하지 않습니다. 관리자 기본 포인트·경험치를 상속하는 퀘스트는 복사 후에도 기본값을 계속 상속합니다.</p><p><b>중복 방지:</b> 이름·카테고리·목표가 동일하면 이미 존재하는 퀘스트로 판단해 제외합니다. 계정당 최대 30개이며 빈 자리를 초과하면 일부만 몰래 가져오지 않고 전체 작업을 중단합니다. 필요한 카테고리가 없으면 원본의 카테고리 아이콘과 함께 자동으로 추가합니다. 가져온 퀘스트는 오늘 미완료부터 시작하며, 가져오기 기록과 설정은 JSON Save/Load에 포함됩니다.</p></section><section class="manual-section"><h3>👀 퀘스트 보기 방식 (v1.6.5)</h3><p>오늘(홈) 화면의 <b>보기 방식</b>에서 <b>카드형 / 큰 카드 / 상세 목록 / 간편 리스트</b>를 선택할 수 있습니다. 카드형은 기존 디자인입니다. 큰 카드는 글자와 버튼을 넉넉하게 보여주고, 상세 목록은 각 퀘스트를 한 줄씩 순서대로 표시하면서 목표·보상·완료 버튼을 계속 보여줍니다. 간편 리스트는 제목·기본 포인트·경험치를 짧게 보여주며, 해당 줄을 누르면 목표와 완료 버튼이 아래로 펼쳐집니다.</p><p>보기 방식과 정렬(미완료 먼저·완료 먼저·카테고리·등록 순서)은 별도 설정으로, <b>각 계정에 독립적으로 저장</b>되고 JSON Save/Load에 포함됩니다. 보기 방식을 바꾸어도 퀘스트 내용·완료 여부·보상·활성 타이머는 바뀌지 않습니다. 구버전 데이터는 카드형을 기본값으로 사용합니다.</p></section><section class="manual-section"><h3>↕ 퀘스트 보기 정렬</h3><p>오늘 화면의 <b>보기 정렬</b>에서 미완료 먼저(기본), 완료 먼저, 카테고리 순, 등록 순서를 선택할 수 있습니다. 정렬은 <b>표시 순서만 바꾸며</b> 퀘스트 등록 순서·보상·완료 기록을 수정하지 않습니다. 각 사용자별 보기 설정은 자동 저장 및 JSON 백업에 포함됩니다. 다음 날에는 새로운 날짜의 완료 여부를 기준으로 다시 정렬됩니다.</p></section><section class="manual-section"><h3>📱 휴대폰 하단 메뉴 사용법 (최종판)</h3><p>하단 메뉴 그림은 <b>집(오늘) · 몬스터볼(뽑기) · 펼친 책(도감) · 날짜 달력(달력) · 체크 기록지(기록)</b>를 뜻하며, 기기에서 별도 이미지를 내려받지 않아도 표시됩니다. 휴대폰의 <b>오늘·뽑기·도감·달력·기록</b> 메뉴는 스크롤을 내려도 화면 맨 아래에 고정됩니다. 메뉴 위의 <b>⌄ 메뉴 접기</b>를 누르면 작은 <b>☰ 메뉴 펼치기</b> 손잡이만 남습니다. 다시 누르면 5개 메뉴를 바로 사용할 수 있습니다. 접기 상태는 해당 기기에 저장됩니다. 갤럭시탭에서는 화면 왼쪽 고정 메뉴로 보입니다. 로그인 화면에서는 이 메뉴가 숨겨집니다.</p></section><section class="manual-section"><h3>📚 v1.6.5 퀘스트 보상 및 도감 보기</h3><p>퀘스트 등록·수정·삭제는 관리자 비밀번호 인증 후 가능합니다. 각 퀘스트의 기본 랜덤 포인트는 <b>관리자 기본 범위 상속</b> 또는 <b>개별 최소·최대·간격</b> 중 선택합니다. 경험치도 <b>관리자 기본값 상속(초기 25XP)</b> 또는 <b>퀘스트별 0~1000XP</b> 중 선택합니다. 오늘(홈) 화면의 경험치 옆에서 🪙 현재 보유 포인트와 ✅ 오늘 퀘스트 진행 수(완료/전체, 예: 3/8)를 바로 확인할 수 있습니다. 퀘스트를 완료하면 이 숫자는 즉시 갱신되며, 날짜가 바뀌면 오늘의 완료 개수만 새날 기준으로 다시 계산합니다. 캘린더의 노란 포켓몬 얼굴 아이콘은 그날 포켓몬을 뽑았다는 표시이며, 날짜 상세의 경험치는 실제 퀘스트별 지급 XP 합계입니다. 오늘 퀘스트 카드에는 🪙 기본 포인트 범위와 🌟 확정 XP를 따로 표시합니다. 포인트 기본 금액은 균등 추첨하며, 시간 배수와 퀘스트별 연속 포인트 배수를 곱합니다. XP는 전체 연속 도전 배수를 곱합니다. 일반 완료는 기본 포인트 그대로 ×1.00입니다. 기존 퀘스트는 관리자 기본값을 그대로 사용합니다.</p><p>도감은 <b>카드형 / 큰 그림형 / 목록형</b>을 선택할 수 있습니다. 카드형은 두 손가락 핀치·버튼·슬라이더로 열 개수를 조절합니다. 그림 우선·문구 자동 숨김 규칙으로 겹침을 방지하며, 선택한 형태와 휴대폰/태블릿 열 개수는 해당 트레이너의 JSON에도 보관됩니다.</p></section><section class="manual-section" id="m-users"><h3>👥 사용자 계정 관리 (v1.0)</h3>${renderAdminUsers()}<p class="admin-note">계정마다 퀘스트·도감·포인트·레벨·<b>퀘스트 완료 비밀번호</b>가 독립적입니다. 로그인 비밀번호도 ID별로 설정합니다. 다른 계정의 퀘스트 완료 비밀번호는 위 <b>사용자 계정 관리 → 해당 ID → 관리</b>에서 관리자만 변경할 수 있습니다. 뽑기와 포획 확률·기본 보상 규칙은 공통입니다.</p></section>${renderFeverAdmin()}<div class="admin-summary"><span>🔐 관리자 모드 로그인 중</span><span>📚 전체 151종</span><span>🗂 완료 이력 ${data.completions.length}건</span></div>
<div class="backup-actions"><button class="btn-outline" onclick="logoutAdmin()">🔒 관리자 로그아웃</button><button class="btn-outline" onclick="setScreen('home')">게임으로 돌아가기</button></div>
<div class="manual-section"><h3>⏱ v1.5 시간 챌린지 · 홀드 · 스킨 · 글자 크기</h3><p>퀘스트에는 <b>⏱ 타임챌린지</b>와 <b>✅ 일반 완료</b> 두 버튼이 있습니다. 타임챌린지는 제한 시간(기본 10분, 1~240분)을 적용하며 버튼을 눌러 시작합니다. 팝업의 카운트다운과 현재 보상 배수(×3.00→×1.00)가 실시간 표시됩니다. 시간이 끝난 뒤에도 완료할 수 있지만 보상은 ×1.00입니다. <b>⏸ 잠깐 홀드</b>를 누르면 남은 시간·배수가 멈추고 <b>▶ 다시 시작하기</b>를 누르면 이어서 진행합니다. 홀드 중에는 완료할 수 없으며 먼저 재개해야 합니다. 홀드 횟수와 누적 쉬는 시간은 완료 이력 및 JSON 백업에 기록됩니다. 새로고침해도 홀드 상태는 유지됩니다(자동 저장 ON 기준).</p><p>완료 버튼을 누른 시점의 배수가 확정되고, 퀘스트 완료 비밀번호를 올바르게 입력해야 기본 랜덤 포인트 × 배수(반올림)가 지급됩니다. 경험치는 관리자 기본값(기본 25XP) 또는 퀘스트 개별 XP에 전체 연속 도전 XP 부스트를 곱해 지급합니다. 시간 배수는 XP에 적용하지 않습니다. 전체 달성 보너스는 관리자 설정 그대로입니다. 완료 이력·진행 중 타이머는 JSON에 포함됩니다. 자동 저장을 끄면 앱 종료 시 진행 중인 타이머가 복구되지 않을 수 있습니다.</p><p>설정 → 화면 스킨(밝음/밤하늘), 글자 크기(보통/크게/아주 크게)를 선택할 수 있습니다. 스킨 설정은 현재 기기의 브라우저에 저장됩니다.</p></div>
<div class="manual-section" id="m-rewards"><h3>🎁 관리자: 포인트·경험치(XP) 및 전체 달성 보너스</h3><p>모든 퀘스트는 종류/목표/카테고리에 관계없이 동일한 포인트 난수 규칙을 사용합니다. 최소~최대 범위에서 설정한 간격의 모든 정수가 균등하게 나옵니다. 하루 전체 퀘스트를 완료하면 보너스를 1회만 지급합니다. 오늘의 퀘스트 구성을 수정해도 이미 받은 보너스는 반환·재지급되지 않습니다. 경험치는 관리자 기본값(초기 25XP)을 사용하며 개별 퀘스트에서 0~1000XP를 지정할 수 있습니다. 설정 변경은 이미 받은 XP를 수정하지 않습니다.</p>
<form class="qform" onsubmit="saveRewards(event)"><div class="admin-form-number"><label>최소 포인트<input class="qentry" name="pointMin" type="number" min="0" max="10000" required value="${data.rules.pointMin}"></label><label>최대 포인트<input class="qentry" name="pointMax" type="number" min="0" max="10000" required value="${data.rules.pointMax}"></label><label>지급 간격<select class="qentry" name="pointStep">${[1,5,10,20,50,100].map(v=>`<option value="${v}" ${v===data.rules.pointStep?'selected':''}>${v}P</option>`).join('')}</select></label><label>전체 달성 보너스 (P)<input class="qentry" name="allDoneBonus" type="number" min="0" max="100000" required value="${data.rules.allDoneBonus}"></label><label>🌟 기본 퀘스트 경험치 (XP)<input class="qentry" name="defaultXp" type="number" min="0" max="1000" step="1" required value="${data.rules.defaultXp}"></label></div><p class="admin-note">현재: ${rewardText()} · 완료 XP 기본 ${format(data.rules.defaultXp)}XP · 전체 달성 보너스 ${data.rules.allDoneBonus}P. 보너스는 해당 날짜에 한 번 지급되면 퀘스트 구성을 바꾸어도 중복 지급되지 않습니다. 설정 변경은 향후 달성부터 적용됩니다.</p><button type="submit" class="modal-btn">포인트·XP 규칙 저장</button></form></div>
<div class="manual-section" id="m-config"><h3>🎲 관리자: 뽑기 상세 확률 설정</h3><p>뽑기별 일반·레어·에픽·전설 <b>등장 확률 합계 100%</b>를 입력하세요. 포획 성공률은 각각 0~100%로 설정할 수 있습니다. 같은 등급에 속한 포켓몬은 무조건 동일 확률로 선정합니다. 변경 전 뽑기 결과/달력 이력은 유지됩니다.</p>
<div class="admin-quick-controls" role="group" aria-label="확률 빠른 조정"><button type="button" class="btn-outline" onclick="oddsQuickAdjust('gap')">↔ 격차 늘리기</button><button type="button" class="btn-outline" onclick="oddsQuickAdjust('up')">↗ 전체 상향</button><button type="button" class="btn-outline" onclick="oddsQuickAdjust('down')">↘ 전체 하향</button><button type="button" class="btn-outline" onclick="oddsQuickAdjust('defaults')">↺ 확률 초기값 입력</button></div><p class="admin-note">빠른 조정은 아래 입력칸만 변경합니다. 저장 버튼을 눌러야 실제 적용됩니다. 관리자 전체 설정 초기화는 아래 별도 버튼을 이용하세요.</p><div class="admin-table-wrap"><table class="admin-table" style="min-width:650px"><thead><tr><th>볼</th><th>레어 이상 등장</th><th>전설 최종 포획</th><th>전체 포획 성공</th><th>등장률 합계</th></tr></thead><tbody id="oddsSummaryRows">${TIERS.map(t=>{const p=probFor(t),c=catchFor(t);return `<tr><th>${t.name}</th><td>${(100-p[0]).toFixed(2)}%</td><td>${(p[3]*c[3]/100).toFixed(3)}%</td><td>${p.reduce((a,v,i)=>a+v*c[i]/100,0).toFixed(2)}%</td><td>100.00%</td></tr>`}).join('')}</tbody></table></div><form id="oddsEditor" class="qform" oninput="updateOddsSummary()" onsubmit="saveOdds(event)"><div class="admin-table-wrap"><table class="admin-table admin-input-table"><thead><tr><th>등장 등급 확률 (%)</th>${RN.map(r=>`<th>${r}</th>`).join('')}</tr></thead><tbody>${TIERS.map(t=>`<tr><th>${t.name}</th>${probFor(t).map((v,i)=>`<td><input type="number" name="${t.id}_prob_${i}" aria-label="${t.name} ${RN[i]} 등장" min="0" max="100" step="0.01" required value="${v}"></td>`).join('')}</tr>`).join('')}</tbody></table></div><div class="admin-table-wrap"><table class="admin-table admin-input-table"><thead><tr><th>포획 성공률 (%)</th>${RN.map(r=>`<th>${r}</th>`).join('')}</tr></thead><tbody>${TIERS.map(t=>`<tr><th>${t.name}</th>${catchFor(t).map((v,i)=>`<td><input type="number" name="${t.id}_catch_${i}" aria-label="${t.name} ${RN[i]} 포획" min="0" max="100" step="0.01" required value="${v}"></td>`).join('')}</tr>`).join('')}</tbody></table></div><button type="submit" class="modal-btn">확률 설정 저장 (합계 검사)</button></form></div>
<div class="manual-section" id="m-boost"><h3>🔥 연속 퀘스트 포인트·전체 도전 XP 부스트</h3><p>각 계정의 <b>퀘스트별 연속 완료일</b>은 포인트에, <b>하루 1개 이상 완료한 전체 연속 도전일</b>은 XP에 적용됩니다. 일반 완료에도 적용되고 타임챌린지 시간 배수와 결합하되 상한을 둡니다. 변경은 미래 완료부터 적용됩니다.</p><form class="qform" onsubmit="saveBoostSettings(event)"><div class="admin-form-number"><label>포인트 연속 1일당 증가율 (%)<input name="pointPerDay" class="qentry" type="number" min="0" max="50" step="0.1" value="${data.rules.boost.pointPerDay}" required></label><label>포인트 연속 부스트 최대 추가율 (%)<input name="pointCap" class="qentry" type="number" min="0" max="500" step="0.1" value="${data.rules.boost.pointCap}" required></label><label>전체 도전 1일당 XP 증가율 (%)<input name="xpPerDay" class="qentry" type="number" min="0" max="50" step="0.1" value="${data.rules.boost.xpPerDay}" required></label><label>XP 부스트 최대 추가율 (%)<input name="xpCap" class="qentry" type="number" min="0" max="500" step="0.1" value="${data.rules.boost.xpCap}" required></label><label>최종 포인트 배수 최대 (×)<input name="totalPointCap" class="qentry" type="number" min="1" max="10" step="0.1" value="${data.rules.boost.totalPointCap}" required></label></div><label class="admin-checkbox"><input type="checkbox" name="pointEnabled" ${data.rules.boost.pointEnabled?'checked':''}> 퀘스트별 포인트 연속 부스트 사용</label><label class="admin-checkbox"><input type="checkbox" name="xpEnabled" ${data.rules.boost.xpEnabled?'checked':''}> 전체 연속 도전 XP 부스트 사용</label><div class="admin-quick-controls"><button class="modal-btn" type="submit">부스트 설정 저장</button><button class="btn-outline" type="button" onclick="resetRuleSection('boost')">↺ 부스트 초기값 복원</button></div></form><p class="admin-note">초기값: 포인트 +2%/일 (최대 +50%) · XP +1%/일 (최대 +30%) · 최종 포인트 ×4 제한.</p></div>
<div class="manual-section" id="m-gift-curve"><h3>🎁 5레벨마다 진화하는 포켓몬 선물 확률</h3><p>5레벨의 무료 선물은 일반 100%로 시작하여 레벨 상승에 따라 고급·프리미엄 뽑기 <b>등급 등장 확률을 혼합</b>합니다. 아래 각 기준점 사이에서는 레벨에 따라 <b>직선 보간</b>하며, 최고 기준점 이후 비율을 유지합니다. 포획은 확정이며 비용은 0P입니다. 표의 숫자를 직접 고칠 수 있습니다.</p><form id="giftCurveEditor" class="qform" oninput="updateGiftSummary()" onsubmit="saveGiftCurve(event)"><div class="admin-table-wrap"><table class="admin-table admin-input-table" style="min-width:610px"><thead><tr><th>기준 레벨 (5의 배수)</th><th>일반 혼합 %</th><th>고급 혼합 %</th><th>프리미엄 혼합 %</th></tr></thead><tbody>${data.rules.giftCurve.map((row,i)=>`<tr><th><input type="number" name="giftLevel_${i}" min="5" max="100000" step="5" value="${row.level}" required aria-label="기준 레벨 ${i+1}"></th>${row.weights.map((v,j)=>`<td><input type="number" name="giftWeight_${i}_${j}" min="0" max="100" step="0.01" required value="${v}" aria-label="기준 ${i+1}의 ${TIERS[j].name} 혼합 비율"></td>`).join('')}</tr>`).join('')}</tbody></table></div><div class="admin-quick-controls"><button type="submit" class="modal-btn">선물 확률 곡선 저장</button><button class="btn-outline" type="button" onclick="resetRuleSection('gift')">↺ 선물 초기값 복원</button></div></form><h4>🎯 레벨별 혼합·실제 등급 등장률 (입력값 실시간 미리보기)</h4><div class="admin-table-wrap"><table class="admin-table" style="min-width:760px"><thead><tr><th>레벨</th><th>일반볼 비중</th><th>고급볼 비중</th><th>프리미엄 비중</th><th>일반 등장</th><th>레어 등장</th><th>에픽 등장</th><th>전설 등장</th></tr></thead><tbody id="giftPreviewRows">${giftDetailRows()}</tbody></table></div></div>
<div class="manual-section" id="m-full-reset"><h3>🔄 관리자 설정 초기값 복원 (게임 데이터 유지)</h3><p>추천 출고 초기값은 <b>기본 포인트 20~40P (5P 간격), XP 25, 전체 달성 50P, 새로운 확률표, 연속 부스트, 선물 확률 곡선</b>입니다. 설정값만 되돌리며 사용자·퀘스트·누적 보상·포켓몬·기록을 지우지 않습니다. <b>게임 전체 초기화와 다릅니다.</b></p><button type="button" class="btn-outline" onclick="resetRuleSection('all')">↺ 모든 확률·보상 설정 추천 초기값 복원</button></div>
<div class="manual-section" id="m-formulas"><h3>🧮 실제 계산식 및 현재 설정값 총정리</h3>
<p>① <b>기본 포인트</b> P₀: {min, min+step, …, max}를 동일 확률로 추첨. 각 금액 확률 = 100 ÷ ((max−min)/step+1)%.<br>② <b>시간 배수</b> T = max(1,min(3,1+2×남은시간/제한시간)). 일반 완료 T=1; 홀드 시간은 제외.<br>③ <b>퀘스트 연속일</b> s: 이번 퀘스트 완료 날짜까지 연속 수행한 달력일, 오늘 첫 완료라면 이전 수행일이 어제일 때 이어짐. P부스트 = 1+min(포인트 최대추가율, (s−1)×일일증가율)/100 (사용 OFF면 1).<br>④ <b>FEVER 적용 전 포인트</b> = round(P₀ × min(최종 상한, T × P부스트)); FEVER ON이면 최종 P=round(전 단계 포인트×1.10).<br>⑤ <b>전체 연속 도전일</b> d: 오늘 최소 한 퀘스트 완료하면 하루 증가하며 같은 날 추가 완료해도 d 일정. XP부스트 = 1+min(XP 최대추가율,(d−1)×XP일일증가율)/100 (OFF면 1).<br>⑥ <b>FEVER 적용 전 XP</b> = round(퀘스트 기본 XP × XP부스트); FEVER ON이면 최종 XP=round(전 단계 XP×1.10). 시간 배수는 XP에 적용하지 않음.<br>⑦ <b>레벨 업</b> = 현재 레벨 × 120XP; 초과분 다음 레벨로 이월. 5의 배수 레벨마다 무료 포켓몬 1종 지급; 일반 레벨 보상 = 레벨 × 50P(직접 수령). 하루 전체 달성 = 설정된 고정 보너스 1회.<br>⑧ <b>몬스터볼 한 번의 등급 당첨</b> = 해당 볼의 등급 등장 확률 p; 해당 등급 1종 등장 확률 p/N; <b>최종 포획</b> p/N × 포획 성공률/100. 등급 전체 포획 확률 = p × 포획 성공률/100. 전체 포획 성공률 = Σ(등급 등장 확률 × 등급 포획 성공률/100). 실패 확률 = 100−전체 성공률.<br>⑨ <b>선물 확률 보간</b>: 인접 기준 (L₀,W₀),(L₁,W₁)에 대해 t=(L−L₀)/(L₁−L₀), 혼합 가중치 W(L)=(1−t)W₀+tW₁. <b>선물 등급 확률</b> Gᵣ(L)=Σ[혼합된 일반·고급·프리미엄 가중치(%) × 각 볼의 r등급 등장률(%)/100]. 1종 획득률=Gᵣ(L)/해당 등급 종수. 선물 포획 성공률=100%.</p>
<p><b>현재 부스트:</b> 포인트 +${data.rules.boost.pointPerDay}%/일 (최대 +${data.rules.boost.pointCap}%; ${data.rules.boost.pointEnabled?'ON':'OFF'}), XP +${data.rules.boost.xpPerDay}%/일 (최대 +${data.rules.boost.xpCap}%; ${data.rules.boost.xpEnabled?'ON':'OFF'}), 최종 포인트 상한 ×${data.rules.boost.totalPointCap}.</p><p>전설 1종 기준: 프리미엄 유료 1회 등장 ${(probFor(TIERS[2])[3]/pools.legendary.length).toFixed(4)}%; 최종 포획 ${(probFor(TIERS[2])[3]/pools.legendary.length*catchFor(TIERS[2])[3]/100).toFixed(4)}%.</p><p>연속 기록이 끊어지면 다음 완료는 1일차부터 다시 시작합니다. 하루의 여러 퀘스트 완료는 전체 XP 연속일을 한 번만 증가시킵니다. 계산 후 가장 가까운 정수로 반올림합니다. 이미 지급한 보상과 선물은 새로운 설정으로 재계산하지 않습니다.</p></div>

<div class="manual-section"><h3>🏆 5의 배수 레벨 포켓몬 보상 (v1.6.5)</h3><p>Lv.5, 10, 15, 20…을 새로 달성하면 <b>포켓몬 한 마리를 즉시 무료로 선물</b>하고, 특별한 축하 화면과 큰 포켓몬 사진을 보여줍니다. <b>등급별 출현 확률은 레벨에 따라 일반→고급→프리미엄 혼합률로 점진적으로 이동</b>하며, 해당 등급 내 1종을 동일 확률로 추첨합니다. <b>포획 실패가 없으며</b> 바로 도감에 추가됩니다. 중복도 가능합니다. 레벨별 선물은 동일 레벨에 중복 지급되지 않으며 레벨 도달 시 기록됩니다. 기존 계정의 이미 지나간 레벨은 소급 선물하지 않습니다. 선물 기록은 JSON 및 도감·포획 이력에 포함됩니다.</p></div><div class="manual-section" id="m-level-rewards"><h3>🎁 v1.6.5 레벨별 포인트 수령 · 5레벨 포켓몬 선물</h3>
<p><b>첫 시작 선물</b>은 계정당 한 번 <b>600P</b>를 직접 받습니다. 이전 버전에서 이 선물을 이미 받았다면 중복 지급되지 않습니다. 기존 <b>시스템 체험</b> 버튼은 <b>보상 받기</b> 메뉴로 이름이 변경되었습니다.</p>
<p><b>레벨별 포인트</b>는 신규 계정은 Lv.2부터, 기존 계정은 업데이트 당시 레벨 다음부터 1레벨 오를 때마다 <b>도달한 레벨 × 50P</b>가 열립니다. 예: Lv.2=100P, Lv.3=150P, Lv.5=250P, Lv.10=500P. 경험치와 레벨만 올라가도 포인트가 자동으로 지급되지는 않습니다. <b>홈 → 보상 받기</b>에서 수령 버튼을 누른 레벨만 포인트가 추가됩니다. 업데이트 이후 달성한 레벨에서 아직 받지 않은 포인트는 나중에도 수령할 수 있습니다. 업데이트 전 달성한 기존 레벨에는 소급 지급하지 않습니다. 수령한 레벨과 시각은 ID별로 저장되고 JSON 파일에도 들어가 중복 지급을 방지합니다. 레벨업 자체는 일반·고급·프리미엄 뽑기의 등장·포획 확률을 바꾸지 않습니다. 단 Lv.5 단위 선물은 일반 뽑기와 같은 등장 확률로 별도 무료 지급합니다.</p>
<p><b>레벨업 연출:</b> 퀘스트 완료로 현재 레벨 × 120XP를 달성하면 레벨이 올라갑니다. 남는 초과 XP는 다음 레벨로 모두 이월되고, 충분한 XP를 받으면 여러 레벨이 연속 상승할 수 있습니다. 매 레벨 축하 효과가 표시됩니다. <b>Lv.5, 10, 15, 20…</b>처럼 5의 배수 레벨에서는 더욱 큰 특별 연출을 보여줍니다. 이 연출은 확률·포인트 지급을 변경하지 않습니다.</p>
<p><b>퀘스트 목록 정렬:</b> 오늘 화면에서 미완료 먼저(기본), 완료 먼저, 카테고리 순, 등록 순서 중 하나를 선택할 수 있습니다. 정렬은 화면의 순서만 바꾸며 사용자별 JSON에 저장됩니다. 휴대폰 가로모드에서는 퀘스트 카드가 화면 크기에 맞춰 자동 줄바꿈됩니다.</p>
<p><b>데이터 저장/불러오기:</b> 홈 화면에서 가장 아래로 이동했습니다. 계정별 첫 선물·레벨 보상 수령 이력도 전체 JSON에 포함되어 여러 파일을 병합할 때 해당 계정 데이터와 함께 비교합니다. 같은 ID를 별개로 변경한 JSON 사이에는 충돌이 발생할 수 있으므로 병합 전 내용을 확인하세요.</p></div><div class="manual-section" id="m-security"><h3>1. 관리자 비밀번호 / 퀘스트 완료 비밀번호 / 로그인 유지</h3>
<p><b>관리자 비밀번호는 변경 가능</b>하며, 관리자 메뉴에서 현재 비밀번호를 확인한 후 새 비밀번호를 설정할 수 있습니다. 마스터 비밀번호는 고정된 복구 수단이며 화면에 번호를 표시하지 않습니다. 로그인한 뒤에는 같은 탭에서 새로고침해도 로그인 상태가 유지됩니다. 로그인 화면의 30일 유지 옵션을 선택하면 이 기기의 앱 재실행 시에도 자동 복원됩니다. 로그아웃하거나 30일이 지나면 다시 인증합니다. 이 최초 시작 인증은 관리자 매뉴얼 로그인을 자동으로 열어주지 않습니다. 매뉴얼을 보려면 게임 화면 우측 상단 🔒에서 다시 관리자 인증을 하세요.</p>
<p>🔐 <b>로그인 유지 관련:</b> 사용자 ID만 이 기기의 브라우저에 임시 저장되며, 비밀번호를 별도로 다시 저장하지 않습니다. 30일 유지 옵션을 사용한 개인 기기는 누구나 앱을 열어 해당 사용자의 기록을 볼 수 있습니다. 관리자 메뉴와 퀘스트 완료는 별도 비밀번호로 보호됩니다. 공용 기기에서는 로그인 유지 옵션을 끄고 사용 후 전환 버튼으로 로그아웃하세요. JSON Save/Load 파일에는 기기별 자동 로그인 상태가 포함되지 않습니다.</p><p><b>퀘스트 완료 비밀번호</b>는 각 사용자 ID마다 따로 저장됩니다. 완료 버튼을 누른 뒤 <b>현재 로그인한 ID의 퀘스트 완료 비밀번호</b>를 입력해야 완료 기록·포인트·해당 퀘스트에 설정된 XP가 부여됩니다. 아래의 단독 변경 메뉴는 <b>main 계정 전용</b>이며, 다른 계정은 <b>관리자 → 사용자 계정 관리 → 해당 ID → 관리</b>에서 변경합니다. 모든 신규 계정의 퀘스트 완료 비밀번호는 계정 생성 시 관리자가 지정할 수 있습니다.</p>

<form class="qform" onsubmit="changeMainQuestPassword(event)"><h3>🔑 main 계정 전용 · 퀘스트 완료 비밀번호 변경</h3><p class="admin-note"><b>적용 대상: @main 계정만.</b> 현재 다른 ID로 로그인해 있어도 이 메뉴에서는 main의 퀘스트 완료 비밀번호만 변경합니다. 다른 ID는 위의 <b>사용자 계정 관리 → 해당 ID → 관리 → 퀘스트 완료 비밀번호</b>에서 변경하세요.</p><label for="newUserPin">main 계정의 새 퀘스트 완료 비밀번호</label><input id="newUserPin" name="newPin" class="qentry" type="password" inputmode="numeric" autocomplete="new-password" maxlength="8" minlength="4" pattern="[0-9]{4,8}" required placeholder="새 숫자 4~8자리"><label for="newUserPinConfirm">main 계정의 새 퀘스트 완료 비밀번호 확인</label><input id="newUserPinConfirm" name="confirmPin" class="qentry" type="password" inputmode="numeric" autocomplete="new-password" maxlength="8" minlength="4" pattern="[0-9]{4,8}" required placeholder="같은 번호 다시 입력"><button class="modal-btn" type="submit">main 계정 비밀번호만 변경</button></form>
<p>주의: 퀘스트 완료 비밀번호는 <b>사용자 ID별로 독립적으로 저장</b>되고 JSON에도 포함됩니다. 이 비밀번호는 개인용 HTML의 사용 제어 기능으로, 코드 또는 JSON에 접근할 수 있는 사람까지 막는 강력한 보안·암호화 기능은 아닙니다.</p></div>
<div class="manual-section"><h3>카테고리와 목표 설정법</h3><p>오늘 화면의 <b>⚙️ 퀘스트 보기 · 정렬 · 관리 → 카테고리 관리</b>에서 새 카테고리를 등록하거나 이름과 이모지(과학 🧪, 수학 📐, 피아노 🎹, 바이올린 🎻 등)를 바꿀 수 있습니다. 카테고리를 삭제하면 연결된 퀘스트는 기타로 옮겨지고 과거 이력은 유지됩니다. 목표는 시간(분)으로 제한하지 않고 <b>책 20쪽, 피아노 30분, 수학 문제 15개, 운동 3세트</b>처럼 글자+숫자를 자유롭게 입력합니다.</p><p>관리자 설정에서 포인트 범위, 지급 간격, 기본 경험치(XP), 하루 전체 완료 보너스, 단계별 등급 등장 확률·포획 성공률을 지정할 수 있습니다. 설정값과 보너스 지급 기록은 JSON Save/Load로 함께 이동합니다.</p></div><div class="manual-section"><h3>v1.7.4 오늘 화면: 퀘스트 중심 구성</h3><p><b>나의 ID</b>에는 트레이너 칭호·레벨·경험치·현재 포인트·도감 수집 현황을 한 곳에 표시합니다. 아래 <b>오늘의 퀘스트</b>에는 연속 도전 일수와 <b>완료/전체</b> 진행도를 보여주고, 퀘스트 수행 버튼을 우선 배치합니다. 정렬·4가지 보기 방식·퀘스트 등록·다른 계정에서 가져오기·카테고리 관리는 목록 아래의 <b>⚙️ 퀘스트 보기 · 정렬 · 관리</b>를 눌러 펼칩니다. 카드의 수정 버튼도 설정을 펼쳤을 때만 보입니다. 각 퀘스트에서 연속 수행 중이면 <b>🔥 연속 N일</b>로 표시하고, 오늘 아직 수행하지 않았다면 어제까지 기록을 유지해 보여주며, 오늘 완료하면 즉시 늘어납니다. 하루를 건너뛰어 연속 일수가 0이 되면 <b>📅 마지막 수행: YYYY.MM.DD</b>로 가장 최근 완료일을 보여줍니다. 완료 기록이 전혀 없는 퀘스트는 <b>🌱 아직 수행 전</b>으로 표시합니다. <b>상단의 전체 연속 도전</b>은 하루에 등록된 퀘스트 중 <b>최소 하나만 완료해도 그날을 1일</b>로 인정합니다. 같은 날 여러 개를 완료해도 1일로 계산하며, 어제 완료했다면 오늘 첫 완료 전까지 어제의 연속 기록을 유지해 보여줍니다. 하루 전체를 빠지면 다음 날부터 0일입니다. 퀘스트별 기록은 각각 독립 계산하고, 삭제한 퀘스트의 과거 완료 날짜도 전체 연속 도전 기록에 포함됩니다. 과거 완료 이력은 삭제하지 않습니다. 보상 받기는 퀘스트 다음, JSON Save/Load는 화면 맨 아래에 있습니다.</p></div><div class="manual-section" id="m-howto"><h3>2. 게임 시작, 퀘스트, 포인트</h3><ol><li>앱 시작 시 설정된 관리자 비밀번호를 입력합니다.</li><li>오늘 탭의 <b>⚙️ 퀘스트 보기 · 정렬 · 관리 → 매일 할 퀘스트 등록</b>을 눌러 항목·직접 만든 카테고리·자유 형식 목표를 등록합니다. 자동 생성 퀘스트는 없습니다.</li><li>필요하면 퀘스트의 <b>수정</b> 버튼으로 이름·카테고리·목표를 수정할 수 있습니다. 최대 30개까지 등록할 수 있고, 삭제 후에도 이전 이력은 남습니다.</li><li>오늘 화면에서 <b>⏱ 타임챌린지</b>를 선택해 카운트다운을 진행하거나 <b>✅ 일반 완료</b>를 눌러 타이머 없이 완료합니다. 두 방식 모두 <b>현재 로그인한 ID의 퀘스트 완료 비밀번호</b>로 승인합니다. 정확히 승인한 다음에만 완료 처리됩니다.</li><li>각 퀘스트는 두 완료 방식 중 <b>하루 한 번만</b> 보상을 받을 수 있고, 다음 날 다시 활성화됩니다. 같은 퀘스트의 타이머가 진행 중인데 일반 완료를 선택하면, 시간 보너스를 포기한다는 확인 후 일반 완료로 전환됩니다.</li><li>매번 <b>${rewardText()}</b> 규칙에 따라 포인트가 균등한 확률로 지급됩니다. 퀘스트 카테고리 자체에 따른 포인트 확률 가중치는 없습니다. 일반 완료는 ×1.00, 타임챌린지는 완료 속도에 따라 ×1.00~×3.00이 적용됩니다. 경험치는 기본 <b>${data.rules.defaultXp}XP</b> 또는 퀘스트별 별도 설정값을 받습니다. 시간 배수는 XP에 적용되지 않습니다.</li></ol><p>포인트는 뽑기에 사용되며, 경험치(XP)는 개인 성장 레벨을 결정합니다. 포인트는 소모 가능하지만 레벨업 후 남은 경험치(XP)는 다음 레벨로 전액 이월됩니다. 누적 획득 XP는 기록 보존용으로 저장됩니다.</p></div>
<div class="manual-section" id="m-level"><h3>3. 레벨·경험치(XP) · 성장 그림</h3>
<p><b>레벨업에 필요한 XP는 현재 레벨 × 120XP</b>입니다. Lv.1에서 Lv.2로 오르려면 120XP, Lv.2→Lv.3은 240XP, Lv.3→Lv.4는 360XP가 필요합니다. <b>레벨업 시 초과 XP는 다음 레벨로 전액 이월됩니다.</b> 예를 들어 Lv.1에서 130XP를 얻으면 Lv.2가 되고 10/240XP가 남습니다. 한 번에 여러 레벨을 넘으면 각각의 레벨업 및 5레벨 보상을 순서대로 반영합니다. 퀘스트 XP는 관리자 기본 <b>${format(data.rules.defaultXp)}XP</b> 또는 퀘스트별 0~1000XP입니다. 업데이트 이전 계정은 당시 레벨·진행 XP·보상 이력을 보존한 채 새로운 다음 레벨 기준을 사용합니다. 누적 획득 XP는 과거 이력 확인용으로 남으며 레벨 계산에 사용되지 않습니다.</p>
<div class="manual-rank-list"><strong>🎖️ 전체 트레이너 직급</strong><div class="manual-rank-grid">${TRAINER_RANKS.map(([level,icon,title])=>`<div><b>${icon} Lv.${level}</b><span>${esc(title)}</span></div>`).join('')}</div></div>
<div class="admin-table-wrap"><table class="admin-table" style="min-width:570px"><thead><tr><th>목표 레벨</th><th>이번 레벨 필요 XP</th><th>초과 XP 처리</th><th>해당 구간 필요 퀘스트 (${data.rules.defaultXp}XP 기준)</th></tr></thead><tbody>${[2,3,4,5,10,20,30,50,100].map(n=>`<tr><td>Lv.${n}</td><td>${format(120*(n-1))}</td><td>다음 레벨에 이월</td><td>${data.rules.defaultXp>0?format(Math.ceil(120*(n-1)/data.rules.defaultXp))+'회':'—'}</td></tr>`).join('')}</tbody></table></div>
<p>성장 아이콘·칭호는 Lv.1~100 구간에서 5레벨마다 승급합니다(최초 Lv.1 시작). Lv.100에 <b>포켓몬 마스터</b>가 되며 Lv.125·150·200에도 상위 칭호가 열립니다. Lv.200 이후엔 50레벨마다 명예 등급이 올라갑니다. 홈에서 <b>직급 보기</b>를 눌러 모든 단계와 다음 승급까지 남은 레벨을 확인할 수 있습니다. <b>유료 뽑기의 등장률·포획률은 레벨에 따라 바뀌지 않습니다. 5레벨 무료 선물 확률만 성장에 따라 달라집니다.</b> 대신 레벨업 축하 연출과 <b>레벨별 직접 수령하는 포인트 보상(해당 레벨 × 50P)과 5의 배수 레벨 무료 포켓몬 증정</b>이 있습니다. 보상은 홈의 🎁 보상 받기에서 확인하세요. 확률은 관리자 설정과 뽑기 단계로만 결정됩니다.</p></div>
<div class="manual-section" id="m-odds"><h3>4. 몬스터볼 뽑기 비용 및 등급 등장 확률</h3><div class="admin-table-wrap"><table class="admin-table" style="min-width:540px"><thead><tr><th>뽑기 단계</th><th>소모 포인트</th><th>일반</th><th>레어</th><th>에픽</th><th>전설</th></tr></thead><tbody>${TIERS.map(t=>`<tr><td>${t.name}</td><td>${t.price}P</td>${probFor(t).map(v=>`<td>${v}%</td>`).join('')}</tr>`).join('')}</tbody></table></div><p>① 등급을 각 단계의 확률로 결정 → ② 그 등급에 포함된 포켓몬 1종을 동일 확률로 추첨 → ③ 독립 포획 판정. 모든 뽑기는 독립적이며 중복 등장/포획 실패가 가능합니다. 유료 뽑기는 확정 지급·천장·레벨 가중치가 없습니다. 별도로 5의 배수 레벨 선물은 일반→고급→프리미엄으로 레벨에 따라 혼합되며, 포획 실패는 없습니다. 레벨별 포인트는 수령 버튼을 눌러 받습니다. 보안 난수를 우선 사용하고 시간 시드로 고정하지 않습니다.</p><p>각 등급에 포함된 포켓몬 수: ${RARITIES.map((r,i)=>`${RN[i]} ${pools[r].length}종`).join(' · ')}.</p></div>
<div class="manual-section" id="m-catch"><h3>5. 포획 성공·실패 확률 / 계산 예시</h3><div class="admin-table-wrap"><table class="admin-table" style="min-width:520px"><thead><tr><th>단계</th><th>일반 포획</th><th>레어 포획</th><th>에픽 포획</th><th>전설 포획</th></tr></thead><tbody>${TIERS.map(t=>`<tr><td>${t.name}</td>${catchFor(t).map(v=>`<td>${v}%</td>`).join('')}</tr>`).join('')}</tbody></table></div><p><b>실패율 = 100 − 성공률.</b> 소모한 포인트는 포획 성공 여부와 상관없이 돌아오지 않습니다. 포획 성공 시에만 도감에 등록되며 중복 포획은 횟수가 누적됩니다. 실패는 달력/기록에 남습니다.</p><p><b>개별 포켓몬 등장률 = 등급 등장률 ÷ 같은 등급 포켓몬 수.</b><br><b>개별 포켓몬 최종 포획률 = 개별 등장률 × 포획 성공률 ÷ 100.</b><br>예: 프리미엄에서 뮤츠 등장률 = ${(probFor(TIERS[2])[3]/pools.legendary.length).toFixed(4)}%, 최종 포획률 = ${(probFor(TIERS[2])[3]/pools.legendary.length*catchFor(TIERS[2])[3]/100).toFixed(4)}%입니다. 애니메이션은 미리 확정된 결과를 보여줄 뿐, 확률을 바꾸지 않습니다.</p></div>
<div class="manual-section" id="m-dex"><h3>6. 관동 지방 포켓몬 151종 전체 도감 / 개별 확률표</h3><p>아래 표에는 각 포켓몬의 도감 번호·이름·등급·일반/고급/프리미엄 개별 등장률·등장 후 포획률·최종 획득률이 모두 있습니다. 옆으로 스크롤해 확인하세요.</p><div class="manual-lookup"><input aria-label="포켓몬 검색" placeholder="이름 또는 도감 번호" type="search" oninput="updateManualSearch(this.value)" value="${esc(manualSearch)}"><select aria-label="등급 선택" onchange="updateManualRarity(this.value)">${[['all','모든 등급'],...RARITIES.map((r,i)=>[r,RN[i]])].map(([id,label])=>`<option value="${id}" ${manualRarity===id?'selected':''}>${label}</option>`).join('')}</select></div><div id="manualPokeList">${renderManualRows()}</div></div>
<div class="manual-section" id="m-history"><h3>7. 달력 / 모든 활동 기록</h3><p><b>달력</b> 탭에서 월간 전체 달력 히트맵과 연간 요약을 볼 수 있습니다. 날짜의 색은 그날 완료한 퀘스트 수(0·1·2·3·4회 이상)를 뜻합니다. 날짜를 누르면 해당 계정의 <b>📝 데일리 노트</b>를 작성·수정·삭제하고, 완료 항목, 획득 포인트, XP, 포켓몬 성공·실패, 카테고리 변경 및 전체 달성 보너스, 퀘스트 생성·수정·삭제 이력을 확인할 수 있습니다. 메모가 있는 날은 달력에 📝 표시가 나타납니다. 노트를 작성해도 퀘스트 완료나 연속 도전일수로 계산되지 않습니다. <b>기록</b> 탭에는 누적 성과, 최근 포획 및 최근 7일 완료 횟수가 있습니다.</p><p>삭제한 퀘스트의 과거 완료 이력은 그대로 유지되며, 관리자 모드 변경 내용은 향후 보안 감사 기록이 아닌 일반 게임 설정 변경으로 취급합니다.</p></div>
<div class="manual-section" id="m-merge"><h3>다중 JSON 안전 병합</h3><p>여러 JSON을 동시에 선택하면 각 계정의 리비전 계보를 비교합니다. 같은 ID의 기록이 한쪽에서만 이어서 수정되었다면 최신 후손을 선택합니다. 여러 기기에서 따로 수정되어 갈라진 경우 자동으로 덮어쓰지 않고 충돌로 표시합니다. 복원 이전 상태는 1회 되돌릴 수 있습니다. 타 기기의 JSON과 자동 동기화되지는 않습니다. <b>병합 이력:</b> ${ (registry.restoreLog||[]).slice(-10).reverse().map(x=>`${esc(x.at)} · ${esc((x.files||[]).join(', '))}`).join('<br>') || '아직 없음' }</p>${backupButtons()}<button class="tinybtn" onclick="undoLastMerge()">↩ 마지막 병합 되돌리기</button></div><div class="manual-section" id="m-save"><h3>8. 자동 저장 / JSON Save·Load / 기기간 이동</h3><ol><li>자동 저장은 <b>기본 ON</b>입니다. 완료 승인, 뽑기, 도감, 편집, 퀘스트 완료 비밀번호 변경 등을 진행하면 즉시 브라우저 저장소에 기록합니다.</li><li><b>설정 → 자동 저장</b>에서 ON/OFF를 바꿀 수 있습니다. OFF에서는 실행 중 데이터만 바뀌므로 수동 JSON Save를 사용하세요.</li><li><b>Save</b>는 퀘스트와 자유 목표, 카테고리/아이콘과 변경 이력, 날짜별 데일리 노트·달성/전체 보너스 지급 이력, 포켓몬 도감/뽑기 기록, 포인트·XP, 첫 선물 및 레벨 보상 수령·5레벨 포켓몬 선물 이력, 관리자 포인트/경험치/확률 설정, 퀘스트 완료 비밀번호 및 미확인 결과까지 단일 JSON에 넣습니다.</li><li><b>Load</b>는 JSON 내용을 현재 기록에 <b>ID별 안전 병합</b>합니다. 두 기기에서 같은 ID를 독립적으로 편집했으면 충돌로 남기고 자동 덮어쓰지 않습니다.</li><li>휴대폰 Save → JSON을 태블릿으로 전송 → 태블릿에서 관리자 시작 비밀번호와 사용자 로그인 후 다중 Load를 실행하면 계정별 최신 본을 병합할 수 있습니다. 복원된 퀘스트 완료 비밀번호도 적용됩니다.</li><li>기존 v0.5 이전 JSON에는 퀘스트 완료 비밀번호 항목이 없으므로 초기 퀘스트 완료 비밀번호가 자동 적용됩니다.</li></ol><p>⚠️ JSON에 퀘스트 완료 비밀번호가 포함되므로 공개 GitHub 저장소에는 업로드하지 마세요. 앱 파일은 공개되지만 개인 데이터는 각 기기의 브라우저 저장소에만 있습니다(별도 백업 파일 제외).</p></div>
<div class="manual-section" id="m-reset"><h3>9. 처음부터 다시 시작 (관리자 전용)</h3><p><b>관리자 모드에서만</b> 전체 초기화를 실행할 수 있습니다. 퀘스트 목록·전체 달력 및 변경 이력·포인트·누적 XP·도감·포획/실패 기록·미확인 결과·퀘스트 완료 비밀번호까지 새 게임 상태로 돌아갑니다. 자동 저장 ON/OFF 설정은 유지합니다.</p><p><b>실행 순서:</b> ① 아래 Save로 전체 JSON 백업 → ② 관리자 전용 초기화 버튼 → ③ 현재 관리자 비밀번호 재입력 → ④ 확인 문구 <b>초기화</b> 입력 → ⑤ 마지막 확인. 성공하면 앱 시작 잠금 화면으로 돌아갑니다. 백업이 없다면 복구할 수 없습니다.</p><div class="backup-actions"><button class="tinybtn" onclick="exportData()">💾 초기화 전 JSON Save</button><button class="btn-outline" onclick="openAdminReset()">⚠️ 전체 초기화 진행</button></div><p class="admin-note">관리자 모드가 아닌 화면(설정/기록 등)에는 초기화 버튼이 표시되지 않습니다. 관리자 모드 안에 있어도 실행 시 비밀번호를 다시 확인합니다.</p></div>
<div class="manual-section" id="m-faq"><h3>10. 문제 해결 / 자주 묻는 질문</h3><ol><li><b>새로고침 후에도 로그인 유지:</b> v1.1에서는 같은 탭의 새로고침은 로그인 상태를 유지하고, 로그인할 때 30일 유지 옵션을 켰다면 앱 재실행 후에도 자동 로그인합니다. 공용 기기라면 30일 유지를 해제하고 사용 후 계정 전환/로그아웃하세요.</li><li><b>퀘스트 완료에 암호가 필요함:</b> 현재 로그인한 ID의 <b>퀘스트 완료 비밀번호</b>를 입력해야 합니다. 로그인 비밀번호 및 관리자 비밀번호와 별도입니다.</li><li><b>퀘스트 완료 비밀번호를 잊음:</b> 관리자 인증 → main 계정은 <b>관리자 → main 계정 전용 · 퀘스트 완료 비밀번호 변경</b>, 다른 계정은 <b>관리자 → 사용자 계정 관리 → 해당 ID → 관리</b>에서 재설정하세요.</li><li><b>레벨이 올랐는데 확률이 그대로임:</b> 정상입니다. 레벨은 유료 뽑기의 등장·포획 확률을 바꾸지 않습니다. 5단위 레벨 달성 시 일반 뽑기 확률로 포켓몬 1종을 확정 증정하고, 홈의 🎁 보상 받기에서 레벨별 포인트를 수령하세요.</li><li><b>데이터가 사라짐:</b> 브라우저 저장 데이터 삭제·접속 주소 변경 등의 원인일 수 있습니다. JSON 백업에서 Load하세요.</li><li><b>포켓몬 그림이 보이지 않음:</b> 그림은 외부 서버에서 받아와서 인터넷 연결이 필요할 수 있습니다.</li><li><b>전부 다시 시작:</b> 관리자 메뉴 → 「처음부터 다시 시작」에서 JSON Save 후 현재 관리자 비밀번호를 재입력해 초기화하세요. 퀘스트 완료 비밀번호도 초기 설정으로 돌아갑니다.</li></ol><p>관리자 비밀번호와 퀘스트 완료 비밀번호은 보안 서버에서 검사하는 계정 인증이 아닙니다. 공개 사이트에서는 진정한 접근 제어가 불가능하므로 개인적인 사용 통제로만 활용하세요.</p></div>`}

// v0.5 — All-history calendar, daily journal, annual overview
function dateKeyFromTime(ts){
 if(typeof ts!=='string'||!ts)return null;
 const korean=ts.match(/^(\d{4})\.\s*(\d{1,2})\.\s*(\d{1,2})\./);
 if(korean){const [,y,m,d]=korean;return `${y}-${m.padStart(2,'0')}-${d.padStart(2,'0')}`}
 const parsed=new Date(ts);if(!Number.isNaN(parsed.getTime()))return `${parsed.getFullYear()}-${String(parsed.getMonth()+1).padStart(2,'0')}-${String(parsed.getDate()).padStart(2,'0')}`;
 const iso=ts.match(/^(\d{4}-\d{2}-\d{2})/);return iso?iso[1]:null;
}
function monthShift(n){const [y,m]=calendarMonth.split('-').map(Number);const d=new Date(y,m-1+n,1);calendarMonth=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;if(!selectedDate.startsWith(calendarMonth))selectedDate=`${calendarMonth}-01`;render()}
function yearShift(n){calendarMonth=String(Number(calendarMonth.slice(0,4))+n)+calendarMonth.slice(4);selectedDate=calendarMonth+'-01';render()}
function selectCalendarDate(key){selectedDate=key;calendarMonth=key.slice(0,7);render()}
function setCalendarMode(mode){calendarMode=mode;render()}
function jumpToday(){calendarMonth=day().slice(0,7);selectedDate=day();calendarMode='month';render()}
function getDailyEvents(key){
 const completions=data.completions.filter(x=>x.day===key);
 const draws=data.draws.filter(x=>dateKeyFromTime(x.timestamp||x.date)===key);
 const changes=data.questEvents.filter(x=>dateKeyFromTime(x.at)===key);
 const bonus=(data.bonusAt&&dateKeyFromTime(data.bonusAt)===key?600:0)+data.dailyBonuses.filter(b=>b.day===key).reduce((a,b)=>a+Number(b.points||0),0);
 return {completions,draws,changes,bonus,earned:completions.reduce((n,x)=>n+Number(x.points||0),0)+bonus,spent:draws.reduce((n,x)=>n+Number(x.price||0),0)};
}
function dailySummaryMap(){const out=new Map();
 const ensure=k=>{if(!out.has(k))out.set(k,{quests:0,draws:0,caught:0,escaped:0,changes:0,earned:0,spent:0,bonus:0});return out.get(k)};
 for(const c of data.completions){if(/^\d{4}-\d{2}-\d{2}$/.test(c.day)){const d=ensure(c.day);d.quests++;d.earned+=Number(c.points||0)}}
 for(const d of data.draws){const k=dateKeyFromTime(d.timestamp||d.date);if(k){const x=ensure(k);x.draws++;x.spent+=Number(d.price||0);if(d.caught===false)x.escaped++;else x.caught++}}
 for(const e of data.questEvents){const k=dateKeyFromTime(e.at);if(k)ensure(k).changes++}
 for(const e of data.categoryEvents){const k=dateKeyFromTime(e.at);if(k)ensure(k).changes++}
 for(const b of data.dailyBonuses){if(b.day){const item=ensure(b.day);item.bonus=(item.bonus||0)+b.points;item.earned+=b.points;}}
 if(data.bonusAt){const k=dateKeyFromTime(data.bonusAt);if(k){ensure(k).bonus+=600;ensure(k).earned+=600}}
 return out;
}
function fmtKey(k){const [y,m,d]=k.split('-');return `${y}년 ${Number(m)}월 ${Number(d)}일`}
const CAL_PIKA_ICON = `<svg class="cal-pika" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false"><path d="M19 24 8 3 24 18 40 18 56 3 45 24" fill="#ffe25d" stroke="#5d4221" stroke-width="2.5" stroke-linejoin="round"/><path d="m8 3 5 11 7-4Z M56 3 44 10 51 14Z" fill="#684326"/><path d="M13 29c0-15 10-21 19-21s19 6 19 21v9c0 12-9 19-19 19S13 50 13 38Z" fill="#ffe35b" stroke="#5d4221" stroke-width="2.5"/><ellipse cx="22.8" cy="34" rx="3.2" ry="4.3" fill="#2b2925"/><ellipse cx="41.2" cy="34" rx="3.2" ry="4.3" fill="#2b2925"/><circle cx="18" cy="43" r="5.7" fill="#f2575a"/><circle cx="46" cy="43" r="5.7" fill="#f2575a"/><path d="M29 42q3 4 6 0M32 45q0 3-3 3" fill="none" stroke="#795038" stroke-width="2" stroke-linecap="round"/></svg>`;
function friendlyEventTime(value){
 const parsed=new Date(value);if(!value||!Number.isFinite(parsed.getTime()))return '시간 미기록';
 return parsed.toLocaleString('ko-KR',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
}
function renderDayDetails(key){const d=getDailyEvents(key);const qs=d.completions.length,tries=d.draws.length,total=qs+tries+d.changes.length+(d.bonus?1:0)+data.categoryEvents.filter(e=>dateKeyFromTime(e.at)===key).length+data.dailyBonuses.filter(b=>b.day===key&&b.points===0).length;
 return `<div class="day-detail"><div class="section-title"><h2>📍 ${fmtKey(key)} 이력</h2><span class="hint">총 ${total}건</span></div>
 <section class="daily-note-section" aria-label="${fmtKey(key)} 데일리 노트"><div class="daily-note-heading"><h3>📝 데일리 노트</h3><span>${dailyNote(key)?'작성됨 ✓':'오늘의 생각을 기록해 보세요'}</span></div>
 <form onsubmit="saveDailyNote(event,'${key}')"><label class="sr-only" for="dailyNoteText">${fmtKey(key)} 데일리 노트 내용</label><textarea class="daily-note-text" id="dailyNoteText" name="dailyNoteText" maxlength="2000" rows="4" placeholder="오늘 기억하고 싶은 일, 잘한 일, 내일의 목표를 써보세요!">${esc(dailyNote(key))}</textarea><div class="daily-note-actions"><small>계정별·날짜별 저장 · 최대 2,000자</small><div><button type="submit" class="daily-note-save">💾 노트 저장</button>${dailyNote(key)?`<button type="button" class="daily-note-delete" onclick="deleteDailyNote('${key}')">삭제</button>`:''}</div></div></form>
 </section><div class="day-metrics"><span>✅ 퀘스트 <b>${qs}</b></span><span>${CAL_PIKA_ICON} 포획 <b>${d.draws.filter(x=>x.caught!==false).length}</b> / 도주 ${d.draws.filter(x=>x.caught===false).length}</span><span>🪙 +${format(d.earned)} / −${format(d.spent)}P</span><span>⭐ +${format(d.completions.reduce((sum,c)=>sum+Number(c.xpEarned??25),0))}XP</span><span>🏆 전체 달성 +${format(data.dailyBonuses.filter(b=>b.day===key).reduce((a,b)=>a+b.points,0))}P</span></div>
 ${!total&&!data.dailyBonuses.some(b=>b.day===key)?`<div class="empty">${dailyNote(key)?'데일리 노트가 저장되어 있습니다. 퀘스트·포획 이력은 아직 없어요.':'아직 저장된 퀘스트·포획 이력이 없습니다. 노트는 자유롭게 작성할 수 있어요.'}</div>`:''}
 ${qs?`<h3>✅ 퀘스트 완료</h3>${d.completions.map(c=>`<div class="history"><div class="hleft"><strong>${esc(c.title||'퀘스트')}</strong><small>${c.goal?`목표 ${esc(c.goal)} · `: ''}${c.multiplier?`${c.mode==='normal'?'✅ 일반 완료':'⏱ 타임챌린지'} ×${Number(c.multiplier).toFixed(2)} · 기본 ${format(c.basePoints??c.points)}P${c.mode==='normal'?'':' · '+questTimeFmt(c.elapsedSeconds||0)}${c.holdSeconds?' · ⏸ 홀드 '+questTimeFmt(c.holdSeconds):''} · `:''}${esc(c.at?new Date(c.at).toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'}):'완료 기록')}${c.recommendedBonus?' · 🌟 추천 +10%':''} · 🌟 +${format(c.xpEarned??0)}XP</small></div><div class="hval" style="color:#82e1ad">+${Number(c.points||0)}P</div></div>`).join('')}`:''}
 ${tries?`<h3>${CAL_PIKA_ICON} 포켓몬 뽑기 / 포획</h3>${d.draws.map(x=>`<div class="history"><div class="hleft"><strong>${x.caught===false?'💨 도주':'🎉 포획'} · ${esc(name(x.id))}</strong><small>${esc(x.tier)} · <span class="rarity ${pokeClass(x.id)}">${RN[RARITIES.indexOf(pokeClass(x.id))]}</span> · 성공률 ${Number(x.catchPct)||0}%</small></div><div class="hval ${x.caught===false?'outcome-bad':''}">−${Number(x.price)||0}P</div></div>`).join('')}`:''}
 ${data.categoryEvents.some(e=>dateKeyFromTime(e.at)===key)?`<h3>🎨 카테고리 변경</h3>${data.categoryEvents.filter(e=>dateKeyFromTime(e.at)===key).map(e=>`<div class="history"><div class="hleft"><strong>${esc(e.action)} · ${esc(e.before||e.after)}</strong><small>${esc(e.after)} ${esc(e.emoji)}</small></div></div>`).join('')}`:''}${d.changes.length?`<h3>✎ 퀘스트 등록·수정·삭제</h3>${d.changes.map(e=>`<div class="history"><div class="hleft"><strong>${e.action==='create'?'등록':e.action==='edit'?'수정':'삭제'} · ${esc(e.after?.title||e.before?.title||'퀘스트')}</strong><small>${esc(e.action==='edit'?`이전 이름: ${e.before?.title||''}`:'변경 이력 보존')} · ${esc(friendlyEventTime(e.at))}</small></div></div>`).join('')}`:''}
 ${d.bonus?`<div class="history"><div class="hleft"><strong>🎁 포인트 보너스 (체험/전체 달성)</strong></div><div class="hval">+${format(d.bonus)}P</div></div>`:''}

// Per-quest consecutive calendar days, independent from the overall daily streak.
// Keep the streak alive during the day until midnight; the first missed full day breaks it.
// Derive from historical completions instead of storing counters, so old JSON stays compatible.
// Streaks and last-completed dates are derived from original completion records.
// A quest completed yesterday still has a live streak today until midnight;
// if there is a gap, report its last completion date instead of "0 days".
function questConsecutiveDays(){
 const datesByQuest=new Map(),todayKey=day();
 for(const item of data.completions){
  if(!item||!/^\d{4}-\d{2}-\d{2}$/.test(item.day||'')||item.day>todayKey)continue;
  if(!datesByQuest.has(item.id))datesByQuest.set(item.id,new Set());
  datesByQuest.get(item.id).add(item.day);
 }
 const result=new Map();
 for(const q of data.quests){
  const dates=datesByQuest.get(q.id)||new Set();
  const last=dates.size?[...dates].sort().at(-1):null;
  const cursor=new Date();cursor.setHours(12,0,0,0);
  if(!dates.has(todayKey))cursor.setDate(cursor.getDate()-1);
  let count=0;
  for(let i=0;i<dates.size;i++){
   const key=`${cursor.getFullYear()}-${String(cursor.getMonth()+1).padStart(2,'0')}-${String(cursor.getDate()).padStart(2,'0')}`;
   if(!dates.has(key))break;
   count++;cursor.setDate(cursor.getDate()-1);
  }
  result.set(q.id,{days:count,last});
 }
 return result;
}

function greetingQuote(uid=String(currentUserId||''),dateKey=day()){
 // Deterministic per-user shuffle cycle: daily stable; no repeats until all phrases used.
 let seed=2166136261;
 for(const c of uid){seed=Math.imul(seed^c.charCodeAt(0),16777619)>>>0}
 const dayIndex=Math.floor(Date.parse(dateKey+'T12:00:00Z')/86400000),cycle=Math.floor(dayIndex/DAILY_QUOTES.length),slot=((dayIndex%DAILY_QUOTES.length)+DAILY_QUOTES.length)%DAILY_QUOTES.length;
 let state=(seed^Math.imul(cycle+1,2654435761))>>>0;
 const order=DAILY_QUOTES.map((_,i)=>i);
 for(let i=order.length-1;i>0;i--){state=(Math.imul(state,1664525)+1013904223)>>>0;const j=state%(i+1);[order[i],order[j]]=[order[j],order[i]]}
 return DAILY_QUOTES[order[slot]];

 const stageText=phase==='encounter'?theme.intro:phase==='flight'?`${theme.action}, 날아가라!`:phase==='shake'?(tierId==='premium'?'황금빛 포획 에너지가 집중돼요!':tierId==='plus'?'번개 에너지를 모으는 중!':'하나… 둘… 셋…!'):e.caught?'포획 성공! 도감에 기록했어요!':'앗! 포켓몬이 몬스터볼을 빠져나왔다!';

}

 if(!confirm('모든 계정과 모든 사용자의 도감·퀘스트·전체 기록을 초기화합니다. JSON 백업 없이 복원할 수 없습니다. 정말 진행하시겠습니까?'))return;
 exportData(); // Attempt a backup download before destructive reset.
 try{localStorage.removeItem(MULTI_KEY);localStorage.removeItem(UNDO_KEY);localStorage.removeItem(KEY)}catch(e){alert('저장소 접근 오류로 초기화를 중단했습니다.');return}
 registry=freshRegistry();if(!saveRegistry(true)){alert('초기화 결과를 저장할 수 없어 작업을 중단합니다.');return}
 clearRememberedLogin();currentUserId=null;startUnlocked=false;adminUnlocked=false;data=DEFAULT();data.rules=registry.rules;screen='home';modal=null;render();}
function downloadJson(object,filename){const blob=new Blob([JSON.stringify(object,null,2)],{type:'application/json;charset=utf-8'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download=filename;document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),30000)}
function snapshotForExport(){if(currentUserId)registry.users[currentUserId].data=data;
 return {app:'PokeRoutine',version:10,exportedAt:isoNow(),settings:{autoSave:settings.autoSave},multi:deepCopy(registry)};
}
function exportData(){downloadJson(snapshotForExport(),`pokeroutine-all-users-${day()}.json`)}
function blankMain(u){return u?.id==='main'&&u.name==='기본 트레이너'&&u.password==='1234'&&u.data?.userPassword==='1234'&&u.data?.points===0&&u.data?.totalXp===0&&!u.data?.quests?.length&&!u.data?.draws?.length&&!u.data?.completions?.length&&!u.data?.questEvents?.length}
function compareRevisions(ours,theirs){
 if(ours.rev&&theirs.rev&&ours.rev===theirs.rev)return 'same';
 if(ours.rev&&lineageList(theirs.lineage).includes(ours.rev))return 'incoming-newer';
 if(theirs.rev&&lineageList(ours.lineage).includes(theirs.rev))return 'local-newer';
 return 'conflict';
}
function isNewerTimestamp(a,b){const x=Date.parse(a.updatedAt),y=Date.parse(b.updatedAt);return Number.isFinite(x)&&Number.isFinite(y)&&x>y}
async function importMultipleFiles(e){
 const files=[...(e.target.files||[])];e.target.value='';if(!files.length)return;if(files.length>30||files.reduce((s,f)=>s+f.size,0)>100*1024*1024){alert('한 번에 최대 30개, 합계 100MB까지만 불러올 수 있습니다.');return}
 const working=deepCopy(registry),actions=[],conflicts=[],errors=[];
 for(const file of files){
  try{
   if(file.size>40*1024*1024)throw Error('40MB 초과');
   const raw=JSON.parse(await file.text());let incoming;
   if(raw?.version===10&&raw?.multi){incoming=cleanRegistry(raw.multi)}
   else if(raw?.app==='PokeRoutine-Multi'&&raw?.version===10){incoming=cleanRegistry(raw)}
   else if(validData(raw?.data||raw)){
    const legacy=legacyAsRecord(raw.data||raw);incoming=freshRegistry();incoming.users={main:legacy};incoming.rules=deepCopy(legacy.data.rules);incoming.rulesRev='legacy-rules-'+legacyFingerprint(incoming.rules);incoming.rulesUpdatedAt=legacy.updatedAt;
   }else throw Error('지원하지 않는 JSON 형식');
   for(const [id,rec] of Object.entries(incoming.users)){
    const local=working.users[id];
    if(!local){
     if(working.deletedUsers?.[id]){conflicts.push({kind:'revive',key:id,file:file.name,candidate:rec,localAt:working.deletedUsers[id].deletedAt,incomingAt:rec.updatedAt});actions.push(`${file.name}: @${id} 이전에 삭제된 계정 — 자동 복구 안 함`);continue}
     working.users[id]=rec;actions.push(`${file.name}: @${id} 신규 추가`);continue
    }
    const result=blankMain(local)&&!blankMain(rec)?'incoming-newer':compareRevisions(local,rec);
    if(result==='incoming-newer'){working.users[id]=rec;actions.push(`${file.name}: @${id} 최신 계보로 갱신`)}
    else if(result==='local-newer'||result==='same'){actions.push(`${file.name}: @${id} 기존 기록 유지 (${result==='same'?'동일':'기존이 최신'})`)}
    else{conflicts.push({kind:'user',key:id,file:file.name,candidate:rec,localAt:local.updatedAt,incomingAt:rec.updatedAt});actions.push(`${file.name}: @${id} 충돌 — 자동 교체 안 함`)}
   }
   // Administrator PIN is merged separately from ordinary game odds and rewards.
   // Old exports without an admin PIN revision cannot reset a newer local password.
   if(incoming.adminPinRev && (incoming.adminPinRev!==working.adminPinRev || incoming.adminPin!==working.adminPin)){
    const localAdmin={rev:working.adminPinRev,lineage:working.adminPinLineage};
    const incomingAdmin={rev:incoming.adminPinRev,lineage:incoming.adminPinLineage};
    const result=working.adminPinRev?compareRevisions(localAdmin,incomingAdmin):'incoming-newer';
    if(result==='incoming-newer'){
     working.adminPin=incoming.adminPin;working.adminPinRev=incoming.adminPinRev;working.adminPinLineage=lineageList(incoming.adminPinLineage);working.adminPinUpdatedAt=incoming.adminPinUpdatedAt;
     actions.push(`${file.name}: 관리자 비밀번호 설정이 최신 계보로 갱신됩니다`);
    }else if(result==='conflict'){
     conflicts.push({kind:'adminPin',key:'adminPin',file:file.name,candidate:{pin:incoming.adminPin,rev:incoming.adminPinRev,lineage:incoming.adminPinLineage,updatedAt:incoming.adminPinUpdatedAt},localAt:working.adminPinUpdatedAt,incomingAt:incoming.adminPinUpdatedAt});
     actions.push(`${file.name}: 관리자 비밀번호 설정 충돌 — 현재 설정 유지`);
    }
   }
   if(incoming.rulesRev&&JSON.stringify(working.rules)!==JSON.stringify(incoming.rules)){
    const ruleLocal={rev:working.rulesRev,lineage:working.rulesLineage},ruleNext={rev:incoming.rulesRev,lineage:incoming.rulesLineage};
    const cmp=compareRevisions(ruleLocal,ruleNext);
    if(cmp==='incoming-newer'){working.rules=deepCopy(incoming.rules);working.rulesRev=incoming.rulesRev;working.rulesLineage=lineageList(incoming.rulesLineage);working.rulesUpdatedAt=incoming.rulesUpdatedAt;actions.push(`${file.name}: 관리자 공통 규칙 갱신`)}
    else if(cmp==='conflict'){conflicts.push({kind:'rules',key:'rules',file:file.name,candidate:{rules:incoming.rules,rev:incoming.rulesRev,lineage:incoming.rulesLineage,updatedAt:incoming.rulesUpdatedAt},localAt:working.rulesUpdatedAt,incomingAt:incoming.rulesUpdatedAt});actions.push(`${file.name}: 관리자 공통 규칙 충돌 — 기존 유지`)}
   }
  }catch(err){errors.push(`${file.name}: ${err.message}`)}
 }
 if(!actions.length){alert('불러올 계정이 없습니다.\n'+errors.join('\n'));return}
 pendingMerge={working,actions,conflicts,errors,files:files.map(f=>f.name)};
 modal={type:'mergePreview'};render();
}
function applyMergedFiles(e){e.preventDefault();if(modal?.type!=='mergePreview'||!pendingMerge)return;
 const next=pendingMerge.working,form=e.currentTarget;
 pendingMerge.conflicts.forEach((c,i)=>{
  const choice=form.elements[`conflict_${i}`]?.value||'keep';
  if(choice==='incoming'){if(c.kind==='user'||c.kind==='revive'){next.users[c.key]=c.candidate;if(c.kind==='revive')delete next.deletedUsers[c.key]}else if(c.kind==='adminPin'){next.adminPin=c.candidate.pin;next.adminPinRev=c.candidate.rev;next.adminPinLineage=lineageList(c.candidate.lineage);next.adminPinUpdatedAt=c.candidate.updatedAt}else{next.rules=deepCopy(c.candidate.rules);next.rulesRev=c.candidate.rev;next.rulesLineage=lineageList(c.candidate.lineage);next.rulesUpdatedAt=c.candidate.updatedAt}}
 });
 const previous=deepCopy(registry);
 // Import must be atomic. A failed rollback snapshot or write must never mutate the visible app.
 try{
  const undo=JSON.stringify(previous),payload=JSON.stringify(next);
  localStorage.setItem(UNDO_KEY,undo);
  localStorage.setItem(MULTI_KEY,payload);
 }catch(err){alert('저장 공간 부족 또는 브라우저 저장 오류로 병합을 중단했습니다. 현재 기록은 유지됩니다. JSON Save 후 공간을 확보하세요.');return}
 registry=next;registry.restoreLog=[...(registry.restoreLog||[]),{at:isoNow(),files:pendingMerge.files,conflicts:pendingMerge.conflicts.length}].slice(-100);
 saveRegistry(true);
 const candidateId=currentUserId;
 if(candidateId&&registry.users[candidateId]?.enabled!==false&&readRememberedLogin()?.id===candidateId)bindTrainer(candidateId);
 else{clearRememberedLogin();currentUserId=null;startUnlocked=false;adminUnlocked=false;data=DEFAULT();data.rules=registry.rules}
 pendingMerge=null;modal=null;screen='home';render();alert('병합 완료! 계정별 최신본을 반영했습니다. 충돌 선택은 미리보기 설정대로 처리했습니다. 설정에서 마지막 병합을 되돌릴 수 있습니다.');
}
function undoLastMerge(){if(!startUnlocked)return;let undo;
 try{const raw=localStorage.getItem(UNDO_KEY);if(!raw)return alert('되돌릴 병합 기록이 없습니다.');undo=cleanRegistry(JSON.parse(raw))}catch(err){return alert('되돌리기 데이터가 손상되었거나 읽을 수 없습니다.')}
 if(!confirm('마지막 병합 직전의 전체 계정 상태로 돌아갈까요? 병합 후 진행한 기록도 원상복구될 수 있습니다.'))return;
 try{localStorage.setItem(MULTI_KEY,JSON.stringify(undo));localStorage.removeItem(UNDO_KEY)}catch(err){return alert('되돌리기 저장에 실패했습니다. 기록을 유지합니다.')}
 registry=undo;const id=currentUserId;if(id&&registry.users[id]?.enabled!==false&&readRememberedLogin()?.id===id)bindTrainer(id);else{clearRememberedLogin();currentUserId=null;startUnlocked=false;data=DEFAULT();data.rules=registry.rules}
 modal=null;screen='home';adminUnlocked=false;render();alert('마지막 병합 직전 상태로 복원했습니다.');
}

// v1.7.4: pinch changes only gallery columns, not browser zoom. One finger scroll remains native.
let dexPinch=null,dexSuppressCardClickUntil=0;
function dexFingerDistance(t){return Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY)}
const dexTouchSurface=document.getElementById('view');
dexTouchSurface.addEventListener('touchstart',event=>{
 const gallery=event.target.closest?.('.dex-gallery.mode-cards');
 if(!gallery||event.touches.length!==2)return;
 const d=dexColumnsDevice();dexPinch={gallery,startDistance:Math.max(1,dexFingerDistance(event.touches)),startColumns:Number(document.getElementById('dexColumnsRange')?.value||data[d.key]),lastColumns:Number(data[d.key])};
 if(event.cancelable)event.preventDefault();
},{passive:false});
dexTouchSurface.addEventListener('touchmove',event=>{
 if(!dexPinch||event.touches.length!==2)return;
 const ratio=dexFingerDistance(event.touches)/dexPinch.startDistance;
 dexPinch.lastColumns=previewDexColumns(dexPinch.startColumns/Math.max(.2,ratio));
 if(event.cancelable)event.preventDefault();
},{passive:false});
function finishDexPinch(){if(!dexPinch)return;const n=dexPinch.lastColumns;dexPinch=null;dexSuppressCardClickUntil=Date.now()+500;commitDexColumns(n)}
dexTouchSurface.addEventListener('touchend',event=>{if(dexPinch&&event.touches.length<2)finishDexPinch()},{passive:true});
dexTouchSurface.addEventListener('touchcancel',finishDexPinch,{passive:true});
document.addEventListener('click',event=>{if(Date.now()<dexSuppressCardClickUntil&&event.target.closest?.('.dex-gallery.mode-cards .dex-entry')){event.preventDefault();event.stopImmediatePropagation()}},true);
