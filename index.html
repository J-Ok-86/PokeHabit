 safe.owned={};for(const [id,item] of Object.entries(v.owned||{})){const n=Number(id);if(Number.isInteger(n)&&n>=1&&n<=151&&item&&typeof item==='object')safe.owned[n]={count:Math.max(1,boundedNumber(item.count,100000)),firstDate:String(item.firstDate||'').slice(0,25)};}

 safe.categoryEvents=Array.isArray(v.categoryEvents)?v.categoryEvents.filter(x=>x&&typeof x==='object').map(x=>({at:String(x.at||'').slice(0,40),action:String(x.action||'').slice(0,20),before:String(x.before||'').slice(0,25),after:String(x.after||'').slice(0,25),emoji:String(x.emoji||'').slice(0,12)})):[];

 if(!Array.isArray(data.dailyBonuses))data.dailyBonuses=[];

 data.rules={pointMin:validNum(r.pointMin,0,10000)?Math.floor(Number(r.pointMin)):defaults.pointMin,pointMax:validNum(r.pointMax,0,10000)?Math.floor(Number(r.pointMax)):defaults.pointMax,pointStep:[1,5,10,20,50,100].includes(Number(r.pointStep))?Number(r.pointStep):5,allDoneBonus:validNum(r.allDoneBonus,0,100000)?Math.floor(Number(r.allDoneBonus)):50,tiers:{}};

function saveOdds(e){e.preventDefault();if(!adminUnlocked||screen!=='manual')return;const f=e.currentTarget,next={};
 for(const t of TIERS){const prob=RARITIES.map((r,i)=>Number(f.elements[`${t.id}_prob_${i}`].value)),catchArr=RARITIES.map((r,i)=>Number(f.elements[`${t.id}_catch_${i}`].value));
 if([...prob,...catchArr].some(x=>!Number.isFinite(x)||x<0||x>100)||Math.abs(prob.reduce((a,b)=>a+b,0)-100)>0.00001){alert(`${t.name}: 등장 확률 합계는 반드시 100%이고 각 값은 0~100이어야 합니다.`);return}

function draw(tierId){if(data.pendingEncounter){openPendingCapture();return}const t=TIERS.find(x=>x.id===tierId);if(!t||data.points<t.price){alert('포인트가 부족합니다. 퀘스트를 완료해 포인트를 모으세요.');return}
 // 등급, 종, 포획 성공 모두 보안 난수로 독립 판정. 결과와 과금은 연출 전에 저장.
 const rarityRoll=rng()*100,rarity=randomRarity(probFor(t),rarityRoll);
 const pool=pools[rarity],poolIndex=ri(0,pool.length-1),id=pool[poolIndex];

 const already=!!data.owned[id],drawId='draw_'+Date.now()+'_'+ri(100000,999999);
 data.points-=t.price;
 if(caught){data.owned[id]={count:(data.owned[id]?.count||0)+1,firstDate:data.owned[id]?.firstDate||day()}}
 data.draws.unshift({drawId,date:new Date().toLocaleString('ko-KR'),timestamp:new Date().toISOString(),id,rarity,tier:t.name,price:t.price,new:caught&&!already,caught,catchPct,rarityRoll,poolIndex,catchRoll});
 data.pendingEncounter={drawId,id,rarity,tier:t.name,new:caught&&!already,caught,catchPct};
 save();openPendingCapture();}

}

<p>주의: 이 PIN은 개인용 HTML의 사용 제어 기능입니다. 코드 또는 JSON 파일에 접근할 수 있는 사람을 막는 강력한 보안·암호화가 아닙니다. 이용 비밀번호는 다른 기기로 이동할 수 있게 JSON에도 포함됩니다.</p></div>
<div class="manual-section"><h3>카테고리와 목표 설정법</h3><p>오늘 화면의 <b>카테고리 관리 · 아이콘 선택</b>에서 새 카테고리를 등록하거나 이름과 이모지(과학 🧪, 수학 📐, 피아노 🎹, 바이올린 🎻 등)를 바꿀 수 있습니다. 카테고리를 삭제하면 연결된 퀘스트는 기타로 옮겨지고 과거 이력은 유지됩니다. 목표는 시간(분)으로 제한하지 않고 <b>책 20쪽, 피아노 30분, 수학 문제 15개, 운동 3세트</b>처럼 글자+숫자를 자유롭게 입력합니다.</p><p>관리자 설정에서 포인트 범위, 지급 간격, 하루 전체 완료 보너스, 단계별 등급 등장 확률·포획 성공률을 지정할 수 있습니다. 설정값과 보너스 지급 기록은 JSON Save/Load로 함께 이동합니다.</p></div><div class="manual-section" id="m-howto"><h3>2. 게임 시작, 퀘스트, 포인트</h3><ol><li>앱 시작 시 관리자 PIN <b>1234</b>를 입력합니다.</li><li>오늘 탭에서 <b>매일 할 퀘스트 직접 등록</b>을 눌러 항목·직접 만든 카테고리·자유 형식 목표를 등록합니다. 자동 생성 퀘스트는 없습니다.</li><li>필요하면 퀘스트의 <b>수정</b> 버튼으로 이름·카테고리·목표를 수정할 수 있습니다. 최대 30개까지 등록할 수 있고, 삭제 후에도 이전 이력은 남습니다.</li><li>목표를 달성하면 <b>완료 +P</b>를 누르고 이용 PIN을 입력하여 승인합니다. 정확히 승인한 다음에만 완료 처리됩니다.</li><li>각 퀘스트는 하루 한 번 완료할 수 있고, 다음 날 다시 완료 가능해집니다.</li><li>매번 <b>${rewardText()}</b> 규칙에 따라 포인트가 균등한 확률로 지급됩니다. 어떤 퀘스트를 했는지, 목표 시간이 얼마인지에 따른 가중치는 없습니다. 매번 추가로 <b>25XP</b>를 얻습니다.</li></ol><p>포인트는 뽑기에 사용되며, 경험치(XP)는 개인 성장 레벨을 결정합니다. 포인트는 소모 가능하지만 XP는 누적됩니다.</p></div>
<div class="manual-section" id="m-level"><h3>3. 레벨·경험치(XP) 상세 규칙</h3>
<p><b>레벨 상한은 현재 없으며</b>, 누적 XP에 따라 계속 올라갑니다. 레벨 N에 도달하려면 <b>120 × (N−1) XP</b>가 필요합니다. 레벨이 1단계 올라갈 때마다 <b>120XP</b>가 필요하며, 매 레벨 동일합니다. 퀘스트 하나를 완료하면 25XP가 주어집니다.</p>
<div class="admin-table-wrap"><table class="admin-table" style="min-width:570px"><thead><tr><th>목표 레벨</th><th>누적 필요 XP</th><th>직전 레벨에서 추가 XP</th><th>총 완료 횟수 (25XP 기준)</th></tr></thead><tbody>${[2,3,4,5,10,20,30,50,100].map(n=>`<tr><td>Lv.${n}</td><td>${format(120*(n-1))}</td><td>${format(120)}</td><td>${format(Math.ceil(120*(n-1)/25))}회</td></tr>`).join('')}</tbody></table></div>
<p><b>현재 레벨이 높아져도 포켓몬 등장률, 포획 성공률, 포인트 지급 확률은 올라가지 않습니다.</b> 레벨은 누적 습관 성장을 보여주는 지표이며 확률은 관리자 설정값과 선택한 뽑기 단계로 결정됩니다. 레벨별 추가 보상/권한은 현재 없습니다.</p></div>
<div class="manual-section" id="m-odds"><h3>4. 몬스터볼 뽑기 비용 및 등급 등장 확률</h3><div class="admin-table-wrap"><table class="admin-table" style="min-width:540px"><thead><tr><th>뽑기 단계</th><th>소모 포인트</th><th>일반</th><th>레어</th><th>에픽</th><th>전설</th></tr></thead><tbody>${TIERS.map(t=>`<tr><td>${t.name}</td><td>${t.price}P</td>${probFor(t).map(v=>`<td>${v}%</td>`).join('')}</tr>`).join('')}</tbody></table></div><p>① 등급을 각 단계의 확률로 결정 → ② 그 등급에 포함된 포켓몬 1종을 동일 확률로 추첨 → ③ 독립 포획 판정. 모든 뽑기는 독립적이며 중복 등장/포획 실패가 가능합니다. 확정 보상·천장·레벨 또는 퀘스트별 가중치가 없습니다. 보안 난수를 우선 사용하고 시간 시드로 고정하지 않습니다.</p><p>각 등급에 포함된 포켓몬 수: ${RARITIES.map((r,i)=>`${RN[i]} ${pools[r].length}종`).join(' · ')}.</p></div>
<div class="manual-section" id="m-catch"><h3>5. 포획 성공·실패 확률 / 계산 예시</h3><div class="admin-table-wrap"><table class="admin-table" style="min-width:520px"><thead><tr><th>단계</th><th>일반 포획</th><th>레어 포획</th><th>에픽 포획</th><th>전설 포획</th></tr></thead><tbody>${TIERS.map(t=>`<tr><td>${t.name}</td>${catchFor(t).map(v=>`<td>${v}%</td>`).join('')}</tr>`).join('')}</tbody></table></div><p><b>실패율 = 100 − 성공률.</b> 소모한 포인트는 포획 성공 여부와 상관없이 돌아오지 않습니다. 포획 성공 시에만 도감에 등록되며 중복 포획은 횟수가 누적됩니다. 실패는 달력/기록에 남습니다.</p><p><b>개별 포켓몬 등장률 = 등급 등장률 ÷ 같은 등급 포켓몬 수.</b><br><b>개별 포켓몬 최종 포획률 = 개별 등장률 × 포획 성공률 ÷ 100.</b><br>예: 프리미엄에서 뮤츠 등장률 = ${(probFor(TIERS[2])[3]/pools.legendary.length).toFixed(4)}%, 최종 포획률 = ${(probFor(TIERS[2])[3]/pools.legendary.length*catchFor(TIERS[2])[3]/100).toFixed(4)}%입니다. 애니메이션은 미리 확정된 결과를 보여줄 뿐, 확률을 바꾸지 않습니다.</p></div>
<div class="manual-section" id="m-dex"><h3>6. 관동 지방 포켓몬 151종 전체 도감 / 개별 확률표</h3><p>아래 표에는 각 포켓몬의 도감 번호·이름·등급·일반/고급/프리미엄 개별 등장률·등장 후 포획률·최종 획득률이 모두 있습니다. 옆으로 스크롤해 확인하세요.</p><div class="manual-lookup"><input aria-label="포켓몬 검색" placeholder="이름 또는 도감 번호" type="search" oninput="updateManualSearch(this.value)" value="${esc(manualSearch)}"><select aria-label="등급 선택" onchange="updateManualRarity(this.value)">${[['all','모든 등급'],...RARITIES.map((r,i)=>[r,RN[i]])].map(([id,label])=>`<option value="${id}" ${manualRarity===id?'selected':''}>${label}</option>`).join('')}</select></div><div id="manualPokeList">${renderManualRows()}</div></div>
<div class="manual-section" id="m-history"><h3>7. 달력 / 모든 활동 기록</h3><p><b>달력</b> 탭에서 월간 전체 달력 히트맵과 연간 요약을 볼 수 있습니다. 날짜의 색은 그날 완료한 퀘스트 수(0·1·2·3·4회 이상)를 뜻합니다. 날짜를 누르면 완료 항목, 획득 포인트, XP, 포켓몬 성공·실패, 카테고리 변경 및 전체 달성 보너스, 퀘스트 생성·수정·삭제 이력을 확인할 수 있습니다. <b>기록</b> 탭에는 누적 성과, 최근 포획 및 최근 7일 완료 횟수가 있습니다.</p><p>삭제한 퀘스트의 과거 완료 이력은 그대로 유지되며, 관리자 모드 변경 내용은 향후 보안 감사 기록이 아닌 일반 게임 설정 변경으로 취급합니다.</p></div>
<div class="manual-section" id="m-merge"><h3>다중 JSON 안전 병합</h3><p>여러 JSON을 동시에 선택하면 각 계정의 리비전 계보를 비교합니다. 같은 ID의 기록이 한쪽에서만 이어서 수정되었다면 최신 후손을 선택합니다. 여러 기기에서 따로 수정되어 갈라진 경우 자동으로 덮어쓰지 않고 충돌로 표시합니다. 복원 이전 상태는 1회 되돌릴 수 있습니다. 타 기기의 JSON과 자동 동기화되지는 않습니다. <b>병합 이력:</b> ${ (registry.restoreLog||[]).slice(-10).reverse().map(x=>`${esc(x.at)} · ${esc((x.files||[]).join(', '))}`).join('<br>') || '아직 없음' }</p>${backupButtons()}<button class="tinybtn" onclick="undoLastMerge()">↩ 마지막 병합 되돌리기</button></div><div class="manual-section" id="m-save"><h3>8. 자동 저장 / JSON Save·Load / 기기간 이동</h3><ol><li>자동 저장은 <b>기본 ON</b>입니다. 완료 승인, 뽑기, 도감, 편집, 이용 PIN 변경 등을 진행하면 즉시 브라우저 저장소에 기록합니다.</li><li><b>설정 → 자동 저장</b>에서 ON/OFF를 바꿀 수 있습니다. OFF에서는 실행 중 데이터만 바뀌므로 수동 JSON Save를 사용하세요.</li><li><b>Save</b>는 퀘스트와 자유 목표, 카테고리/아이콘과 변경 이력, 날짜별 달성/전체 보너스 지급 이력, 포켓몬 도감/뽑기 기록, 포인트·XP, 관리자 포인트/확률 설정, 이용 PIN 및 미확인 결과까지 단일 JSON에 넣습니다.</li><li><b>Load</b>는 JSON 내용을 현재 기록에 <b>ID별 안전 병합</b>합니다. 두 기기에서 같은 ID를 독립적으로 편집했으면 충돌로 남기고 자동 덮어쓰지 않습니다.</li><li>휴대폰 Save → JSON을 태블릿으로 전송 → 태블릿에서 관리자 시작 PIN 1234와 사용자 로그인 후 다중 Load를 실행하면 계정별 최신 본을 병합할 수 있습니다. 복원된 이용 PIN도 적용됩니다.</li><li>기존 v0.5 이전 JSON에는 이용 PIN 항목이 없으므로 <b>1234</b>로 자동 설정됩니다.</li></ol><p>⚠️ JSON에 이용 비밀번호가 포함되므로 공개 GitHub 저장소에는 업로드하지 마세요. 앱 파일은 공개되지만 개인 데이터는 각 기기의 브라우저 저장소에만 있습니다(별도 백업 파일 제외).</p></div>
<div class="manual-section" id="m-reset"><h3>9. 처음부터 다시 시작 (관리자 전용)</h3><p><b>관리자 모드에서만</b> 전체 초기화를 실행할 수 있습니다. 퀘스트 목록·전체 달력 및 변경 이력·포인트·누적 XP·도감·포획/실패 기록·미확인 결과·이용 PIN까지 새 게임 상태로 돌아갑니다. 자동 저장 ON/OFF 설정은 유지합니다.</p><p><b>실행 순서:</b> ① 아래 Save로 전체 JSON 백업 → ② 관리자 전용 초기화 버튼 → ③ 고정 관리자 PIN <b>1234</b> 재입력 → ④ 확인 문구 <b>초기화</b> 입력 → ⑤ 마지막 확인. 성공하면 앱 시작 잠금 화면으로 돌아갑니다. 백업이 없다면 복구할 수 없습니다.</p><div class="backup-actions"><button class="tinybtn" onclick="exportData()">💾 초기화 전 JSON Save</button><button class="btn-outline" onclick="openAdminReset()">⚠️ 전체 초기화 진행</button></div><p class="admin-note">관리자 모드가 아닌 화면(설정/기록 등)에는 초기화 버튼이 표시되지 않습니다. 관리자 모드 안에 있어도 실행 시 비밀번호를 다시 확인합니다.</p></div>
<div class="manual-section" id="m-faq"><h3>10. 문제 해결 / 자주 묻는 질문</h3><ol><li><b>새로고침 후에도 로그인 유지:</b> v1.1에서는 같은 탭의 새로고침은 로그인 상태를 유지하고, 로그인할 때 30일 유지 옵션을 켰다면 앱 재실행 후에도 자동 로그인합니다. 공용 기기라면 30일 유지를 해제하고 사용 후 계정 전환/로그아웃하세요.</li><li><b>퀘스트 완료에 암호가 필요함:</b> 초기 PIN은 1234입니다. 관리자 메뉴의 위 변경 메뉴에서 바꿀 수 있습니다.</li><li><b>이용 PIN을 잊음:</b> 관리자 PIN 1234로 게임 시작 → 관리자 메뉴 로그인 → 이용 PIN 재설정.</li><li><b>레벨이 올랐는데 확률이 그대로임:</b> 정상입니다. 레벨은 성장 기록, 확률은 뽑기 단계에만 연결됩니다.</li><li><b>데이터가 사라짐:</b> 브라우저 저장 데이터 삭제·접속 주소 변경 등의 원인일 수 있습니다. JSON 백업에서 Load하세요.</li><li><b>포켓몬 그림이 보이지 않음:</b> 그림은 외부 서버에서 받아와서 인터넷 연결이 필요할 수 있습니다.</li><li><b>전부 다시 시작:</b> 관리자 메뉴 → 「처음부터 다시 시작」에서 JSON Save 후 PIN 1234를 재입력해 초기화하세요. 이용 PIN도 초기값 1234로 돌아갑니다.</li></ol><p>관리자 PIN과 이용 PIN은 보안 서버에서 검사하는 계정 인증이 아닙니다. 공개 사이트에서는 진정한 접근 제어가 불가능하므로 개인적인 사용 통제로만 활용하세요.</p></div>`}

// v0.5 — All-history calendar, daily journal, annual overview
function dateKeyFromTime(ts){
 if(typeof ts!=='string'||!ts)return null;
 const korean=ts.match(/^(\d{4})\.\s*(\d{1,2})\.\s*(\d{1,2})\./);
 if(korean){const [,y,m,d]=korean;return `${y}-${m.padStart(2,'0')}-${d.padStart(2,'0')}`}
 const parsed=new Date(ts);if(!Number.isNaN(parsed.getTime()))return `${parsed.getFullYear()}-${String(parsed.getMonth()+1).padStart(2,'0')}-${String(parsed.getDate()).padStart(2,'0')}`;
 const iso=ts.match(/^(\d{4}-\d{2}-\d{2})/);return iso?iso[1]:null;
}
function monthShift(n){const [y,m]=calendarMonth.split('-').map(Number);const d=new Date(y,m-1+n,1);calendarMonth=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;if(!selectedDate.startsWith(calendarMonth))selectedDate=`${calendarMonth}-01`;render()}
function yearShift(n){calendarMonth=String(Number(calendarMonth.slice(0,4))+n)+calendarMonth.slice(4);selectedDate=calendarMonth+'-01';render()}
function selectCalendarDate(key){selectedDate=key;calendarMonth=key.slice(0,7);render()}
function setCalendarMode(mode){calendarMode=mode;render()}
function jumpToday(){calendarMonth=day().slice(0,7);selectedDate=day();calendarMode='month';render()}
function getDailyEvents(key){
 const completions=data.completions.filter(x=>x.day===key);
 const draws=data.draws.filter(x=>dateKeyFromTime(x.timestamp||x.date)===key);
 const changes=data.questEvents.filter(x=>dateKeyFromTime(x.at)===key);
 const bonus=(data.bonusAt&&dateKeyFromTime(data.bonusAt)===key?600:0)+data.dailyBonuses.filter(b=>b.day===key).reduce((a,b)=>a+Number(b.points||0),0);

// v1.0 — local multi-trainer profiles and conservative ancestry-aware multi-JSON merges.
// The fixed administrator code is a convenience gate, not secure authentication on a public client.
const VERSION10=10;
// v1.1 adds login persistence only. The JSON/registry version stays 10 for compatibility.
const AUTH_TAB_KEY="pokeroutine_auth_tab_v11", AUTH_REMEMBER_KEY="pokeroutine_auth_remember_v11";
const REMEMBER_MS=30*24*60*60*1000;
const isoNow=()=>new Date().toISOString();
const randomId=()=>{const a=new Uint32Array(3);if(globalThis.crypto?.getRandomValues)crypto.getRandomValues(a);else for(let i=0;i<a.length;i++)a[i]=Math.floor(Math.random()*4294967296);return [...a].map(n=>n.toString(36)).join('-')};
const deepCopy=x=>JSON.parse(JSON.stringify(x));
const idValid=x=>/^[a-z0-9_-]{2,24}$/.test(String(x||''));
const pinValid=x=>/^\d{4,8}$/.test(String(x||''));
const normalizeId=x=>String(x||'').trim().toLowerCase();
const lineageList=x=>Array.isArray(x)?x.filter(y=>typeof y==='string').slice(-2500):[];
function bumpVersion(record){record.lineage=[...lineageList(record.lineage),...(record.rev?[record.rev]:[])].slice(-2500);record.rev=randomId();record.updatedAt=isoNow()}
function makeUser(id,name,password,profile=DEFAULT()){
 return {id,name,password,enabled:true,authRevision:randomId(),updatedAt:isoNow(),rev:randomId(),lineage:[],data:profile};
}
function freshRegistry(){return {app:'PokeRoutine-Multi',version:VERSION10,users:{main:makeUser('main','기본 트레이너','1234')},rules:DEFAULT_RULES(),rulesUpdatedAt:isoNow(),rulesRev:randomId(),rulesLineage:[],restoreLog:[],deletedUsers:{}}}
function cleanRegistry(raw){
 if(!raw||raw.app!=='PokeRoutine-Multi'||raw.version!==10||!raw.users||typeof raw.users!=='object')throw Error('v1.0 계정 백업이 아닙니다.');
 const out={app:'PokeRoutine-Multi',version:VERSION10,users:{},rules:DEFAULT_RULES(),rulesUpdatedAt:String(raw.rulesUpdatedAt||'').slice(0,40),rulesRev:String(raw.rulesRev||''),rulesLineage:lineageList(raw.rulesLineage),restoreLog:Array.isArray(raw.restoreLog)?raw.restoreLog.filter(x=>x&&typeof x.at==='string').slice(-100):[],deletedUsers:{}};
 const entries=Object.entries(raw.users);if(entries.length>100)throw Error('계정이 너무 많습니다. (최대 100)');
 for(const [key,value] of entries){
  const id=normalizeId(key);if(!idValid(id)||!value||typeof value!=='object'||normalizeId(value.id)!==id||out.users[id])throw Error('계정 ID 형식이 잘못되었습니다.');
  if(!pinValid(value.password))throw Error(id+' 계정의 로그인 비밀번호가 올바르지 않습니다.');
  const profile=cleanBackup(value.data);
  out.users[id]={id,name:String(value.name||id).slice(0,28),password:String(value.password),enabled:value.enabled!==false,authRevision:String(value.authRevision||("legacy-"+legacyFingerprint(id+":"+value.password))).slice(0,120),updatedAt:String(value.updatedAt||'').slice(0,40),rev:String(value.rev||''),lineage:lineageList(value.lineage),data:profile};
 }
 if(!entries.length)throw Error('계정이 없는 백업 파일입니다.');
 if(raw.deletedUsers&&typeof raw.deletedUsers==='object'){
  for(const [key,record] of Object.entries(raw.deletedUsers)){
   if(idValid(key)&&record&&typeof record==='object')out.deletedUsers[key]={deletedAt:String(record.deletedAt||'').slice(0,40),rev:String(record.rev||''),lineage:lineageList(record.lineage)};
  }
 }
 // The same validation routine used for live gameplay also validates imported rules.
 const hold=data;data=DEFAULT();data.rules=deepCopy(raw.rules||DEFAULT_RULES());ensureExtensions();out.rules=deepCopy(data.rules);data=hold;
 return out;
}
function currentTrainer(){return registry.users[currentUserId]||{id:'',name:'트레이너',data:DEFAULT()}}
function saveRegistry(force=false){
 if(!settings.autoSave&&!force)return false;
 try{localStorage.setItem(MULTI_KEY,JSON.stringify(registry));storageAvailable=true;storageError='';return true}
 catch(err){storageAvailable=false;storageError='로컬 저장 공간이 부족합니다. JSON Save를 먼저 실행하세요.';return false}
}
function legacyFingerprint(obj){let h=2166136261;const str=JSON.stringify(obj);for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)}return (h>>>0).toString(36)}
function legacyAsRecord(obj){

const oldRenderModal=renderModal;
renderModal=function(){
 if(modal?.type==='userEditor'){
  if(!adminUnlocked||screen!=='manual')return '';
  const original=modal.id,u=original?registry.users[original]:null;
  return `<div class="overlay" onclick="modal=null;render()"><div class="modal" onclick="event.stopPropagation()" role="dialog" aria-modal="true" style="max-height:90dvh;overflow:auto"><h2>👤 ${u?'계정 관리':'계정 생성'}</h2><form class="qform" onsubmit="saveUserAccount(event)"><label>로그인 ID</label><input class="qentry" name="accountId" value="${esc(u?.id||'')}" ${u?'readonly':''} maxlength="24" minlength="2" required placeholder="예: trainer1"><label>홈 화면 표시 이름</label><input class="qentry" name="accountName" value="${esc(u?.name||'')}" maxlength="28" required placeholder="예: 아빠"><label>로그인 비밀번호 (4~8자리 숫자)</label><input class="qentry" name="accountPin" type="password" inputmode="numeric" value="${esc(u?.password||'1234')}" maxlength="8" required><label>퀘스트 완료 비밀번호</label><input class="qentry" name="accountQuestPin" type="password" inputmode="numeric" value="${esc(u?.data.userPassword||'1234')}" maxlength="8" required><label><input type="checkbox" name="enabled" ${u?.enabled!==false?'checked':''}> 로그인 허용</label><button class="modal-btn" type="submit">저장</button></form>${u&&u.id!==currentUserId?`<button class="modal-btn secondary" onclick="disableUser('${u.id}')">활성 / 비활성 전환</button><button class="modal-btn secondary" onclick="deleteUser('${u.id}')">⚠️ 계정 삭제</button>`:''}<button class="modal-btn secondary" onclick="modal=null;render()">닫기</button></div></div>`;
 }
 if(modal?.type==='mergePreview'){
  const p=pendingMerge;if(!p)return '';
  return `<div class="overlay"><div class="modal" role="dialog" aria-modal="true" style="max-height:92dvh;overflow-y:auto"><h2>📂 여러 JSON 안전 병합</h2><p class="modal-sub">파일 ${p.files.length}개 · 처리 ${p.actions.length}건 · 충돌 ${p.conflicts.length}건 · 오류 ${p.errors.length}건</p><div class="merge-summary">${p.actions.map(s=>`<div class="merge-row">${esc(s)}</div>`).join('')}${p.errors.map(x=>`<div class="merge-row" style="color:#ff9ca9">⚠ ${esc(x)}</div>`).join('')}</div><form onsubmit="applyMergedFiles(event)" class="qform">${p.conflicts.length?`<div class="merge-tip">⚠ 충돌: 같은 ID 또는 공통 규칙을 서로 다른 기기에서 별도로 수정한 것으로 보입니다. 날짜가 늦더라도 기록이 더 많다는 보장은 없습니다. 기본값은 현재 기록 유지입니다. 교체가 필요하다면 각 항목을 직접 선택하세요.</div>`:''}${p.conflicts.map((c,i)=>`<div class="merge-row"><strong>${c.kind==='rules'?'공통 관리자 설정':c.kind==='revive'?'이전에 삭제한 @'+esc(c.key):'@'+esc(c.key)}</strong> · ${esc(c.file)}<br>현재 ${esc(c.localAt||'미상')} / 파일 ${esc(c.incomingAt||'미상')}<label>충돌 해결<select name="conflict_${i}"><option value="keep">안전: 현재 기록 유지</option><option value="incoming">⚠ 파일의 계정 전체 기록으로 교체</option></select></label></div>`).join('')}<button type="submit" class="modal-btn">현재 기록 백업 후 병합 적용</button><button type="button" class="modal-btn secondary" onclick="pendingMerge=null;modal=null;render()">취소 · 기록 유지</button></form><p class="pin-help">저장 실패 시 병합하지 않습니다. 여러 파일에서 같은 ID가 독립 변경된 경우 개별 활동까지 자동 합산하지 않습니다.</p></div></div>`;
 }
 return oldRenderModal();
};

restoreRememberedLogin();
render();
if(currentUserId&&data.pendingEncounter)openPendingCapture();
// 기존 결과가 있다면 자동 로그인 직후 연출을 이어갑니다.
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
 window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}
</script></body></html>
