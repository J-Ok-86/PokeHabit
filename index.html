const VERSION10=10;
// These local, client-side PINs are usability gates, not secure authentication.
// Never render either PIN or prefill its value in an input.
const DEFAULT_ADMIN_PIN='1234', MASTER_RECOVERY_PIN='9876';
function currentAdminPin(){return registry&&pinValid(registry.adminPin)?registry.adminPin:DEFAULT_ADMIN_PIN}
function checkAdminPin(pin){return String(pin||'')===currentAdminPin()}
function adminPinRevision(){
 registry.adminPinLineage=[...lineageList(registry.adminPinLineage),...(registry.adminPinRev?[registry.adminPinRev]:[])].slice(-2500);
 registry.adminPinRev=randomId();registry.adminPinUpdatedAt=isoNow();
}
function persistAdminPin(next){
 const previous={adminPin:registry.adminPin,adminPinRev:registry.adminPinRev,adminPinLineage:deepCopy(registry.adminPinLineage||[]),adminPinUpdatedAt:registry.adminPinUpdatedAt};
 registry.adminPin=next;adminPinRevision();
 if(!saveRegistry(true)){
  Object.assign(registry,previous);
  alert('관리자 비밀번호 저장에 실패했습니다. JSON 백업과 브라우저 저장 공간을 확인하세요.');return false;
 }
 return true;
}
function changeAdminPin(e){
 e.preventDefault();if(!adminUnlocked||!startUnlocked||screen!=='manual')return;
 const f=e.currentTarget,oldPin=f.elements['oldAdminPin'].value,newPin=f.elements['newAdminPin'].value,verify=f.elements['newAdminPinConfirm'].value;
 if(!checkAdminPin(oldPin)){alert('현재 관리자 비밀번호가 올바르지 않습니다.');f.reset();return}
 if(!pinValid(newPin)||newPin!==verify){alert('새 관리자 비밀번호는 숫자 4~8자리이며 확인 입력과 일치해야 합니다.');return}
 if(newPin===oldPin){alert('기존과 다른 비밀번호를 입력하세요.');return}
 if(!persistAdminPin(newPin))return;
 adminUnlocked=false;modal=null;screen='home';render();alert('관리자 비밀번호를 변경했습니다. 관리자 메뉴에 다시 로그인하세요.');
}

 if(master!==MASTER_RECOVERY_PIN){alert('마스터 비밀번호가 올바르지 않습니다.');f.elements['masterCode'].value='';return}

}

const AUTH_TAB_KEY="pokeroutine_auth_tab_v11", AUTH_REMEMBER_KEY="pokeroutine_auth_remember_v11";
const REMEMBER_MS=30*24*60*60*1000;
const isoNow=()=>new Date().toISOString();
const randomId=()=>{const a=new Uint32Array(3);if(globalThis.crypto?.getRandomValues)crypto.getRandomValues(a);else for(let i=0;i<a.length;i++)a[i]=Math.floor(Math.random()*4294967296);return [...a].map(n=>n.toString(36)).join('-')};
const deepCopy=x=>JSON.parse(JSON.stringify(x));
const idValid=x=>/^[a-z0-9_-]{2,24}$/.test(String(x||''));
const pinValid=x=>/^\d{4,8}$/.test(String(x||''));

const lineageList=x=>Array.isArray(x)?x.filter(y=>typeof y==='string').slice(-2500):[];
function bumpVersion(record){record.lineage=[...lineageList(record.lineage),...(record.rev?[record.rev]:[])].slice(-2500);record.rev=randomId();record.updatedAt=isoNow()}

}

// Set the largest comfortable quote font that fits the actual available width.
// It runs after each Today render, on resize and after fonts finish loading;
// unlike ellipsis, it never discards the end of the sentence.
let dailyQuoteFitFrame=0;
function fitDailyQuoteSingleLine(){
 dailyQuoteFitFrame=0;
 const el=document.querySelector('.home-daily-quote');
 if(!el||el.getClientRects().length===0)return;
 const available=el.clientWidth;
 if(available<=0)return;
 const isSmall=document.documentElement.getAttribute('data-font-size')==='small';
 const base=isSmall?19:22;
 el.style.setProperty('--daily-quote-fitted-size',base+'px');
 // Iterate because fractional glyph widths, letter-spacing and emoji fallback fonts
 // can make a single proportional adjustment slightly inaccurate.
 for(let attempt=0;attempt<8;attempt++){
  const needed=el.scrollWidth;
  if(needed<=available-1)break;
  const current=parseFloat(getComputedStyle(el).fontSize)||base;
  const next=Math.max(5,Math.min(current-.2,current*(available-2)/needed));
  el.style.setProperty('--daily-quote-fitted-size',next.toFixed(2)+'px');
  if(next<=5)break;
 }
}
function scheduleDailyQuoteFit(){
 if(dailyQuoteFitFrame)cancelAnimationFrame(dailyQuoteFitFrame);
 dailyQuoteFitFrame=requestAnimationFrame(fitDailyQuoteSingleLine);
}

function compareRevisions(ours,theirs){
 if(ours.rev&&theirs.rev&&ours.rev===theirs.rev)return 'same';
 if(ours.rev&&lineageList(theirs.lineage).includes(ours.rev))return 'incoming-newer';

 return 'conflict';
}

 const working=deepCopy(registry),actions=[],conflicts=[],errors=[];
 for(const file of files){
  try{
   if(file.size>40*1024*1024)throw Error('40MB 초과');
   const raw=JSON.parse(await file.text());let incoming;
   if(raw?.version===10&&raw?.multi){incoming=cleanRegistry(raw.multi)}
   else if(raw?.app==='PokeRoutine-Multi'&&raw?.version===10){incoming=cleanRegistry(raw)}

    const legacy=legacyAsRecord(raw.data||raw);incoming=freshRegistry();incoming.users={main:legacy};incoming.rules=deepCopy(legacy.data.rules);incoming.rulesRev='legacy-rules-'+legacyFingerprint(incoming.rules);incoming.rulesUpdatedAt=legacy.updatedAt;

     if(working.deletedUsers?.[id]){conflicts.push({kind:'revive',key:id,file:file.name,candidate:rec,localAt:working.deletedUsers[id].deletedAt,incomingAt:rec.updatedAt});actions.push(`${file.name}: @${id} 이전에 삭제된 계정 — 자동 복구 안 함`);continue}

    }else if(result==='conflict'){
     conflicts.push({kind:'adminPin',key:'adminPin',file:file.name,candidate:{pin:incoming.adminPin,rev:incoming.adminPinRev,lineage:incoming.adminPinLineage,updatedAt:incoming.adminPinUpdatedAt},localAt:working.adminPinUpdatedAt,incomingAt:incoming.adminPinUpdatedAt});
     actions.push(`${file.name}: 관리자 비밀번호 설정 충돌 — 현재 설정 유지`);

function trainPokemon(uid,req){ensureTrainingProfile(data);const mon=data.pokemonRoster.find(x=>x.uid===uid),r=trainingRules();if(!r.enabled||!mon)return;

try" name="evolutionFX">${[['simple','간단'],['normal','보통'],['full','화려하게']].map(([v,t])=>`<option value="${v}" ${r.evolutionFX===v?'selected':''}>${t}</option>`).join('')}</select></label><label><input type="checkbox" name="questXpEnabled" ${r.questXpEnabled?'checked':''}> 대표 포켓몬에게 퀘스트 완료 XP 추가 지급 (선택)</label><div class="qform-row"><div><label>레어 포인트 비용 (빈칸=기본)<input class="qentry" name="rareCost" type="number" min="10" max="10000" placeholder="기본값" value="${r.rarityCosts.rare??''}"></label></div><div><label>전설 포인트 비용 (빈칸=기본)<input class="qentry" name="legendCost" type="number" min="10" max="10000" placeholder="기본값" value="${r.rarityCosts.legendary??''}"></label></div></div><label>포켓몬별 포인트 비용 예외 (선택)<input class="qentry" type="text" name="speciesCosts" placeholder="예: 7=150,25=200" value="${esc(Object.entries(r.speciesCosts).map(([id,cost])=>id+'='+cost).join(','))}"></label><p class="qform-note">도감번호=레벨당 포인트 비용으로 입력하며, 여러 개는 쉼표로 구분합니다. 포켓몬별 설정이 등급별·전체 기본값보다 우선합니다.</p><button class="modal-btn" type="submit">🏋️ 전체 트레이닝 설정 저장</button><button type="button" class="btn-outline" onclick="resetTrainingSettings()">↺ 출고 초기값 입력 복원</button></form><p class="admin-note">1차·2차·3차 특별 진화에 각각 설정한 최소 레벨을 적용하고, 직전 특별 진화 레벨보다 최소 추가 레벨이 필요합니다. 일반 레벨 진화는 별도의 원래 진화 레벨을 적용합니다. 특별 진화는 포인트 없이 레벨만 유지됩니다. 비용은 레벨당 단가(기본 100P)에 비례하며, 레어·전설 등급과 도감 번호별 비용은 선택적으로 조정할 수 있습니다. 원작 조건을 실제 게임에서 검증하는 기능은 아니며 관리자 승인으로 처리합니다.</p></section>`}
function saveTrainingSettings(event){event.preventDefault();if(!adminUnlocked||screen!=='manual')return;const f=event.currentTarget,old=trainingRules(),next={...old,enabled:f.elements.enabled.checked,xpPerLevel:Number(f.elements.xpPerLevel.value),pointCost:Number(f.elements.pointCost.value),startLevel:Number(f.elements.startLevel.value),maxLevel:Number(f.elements.maxLevel.value),autoEvolve:f.elements.autoEvolve.checked,mode:f.elements.mode.value,specialLevels:[Number(f.elements.specialLevel1.value),Number(f.elements.specialLevel2.value),Number(f.elements.specialLevel3.value)],evolutionFX:f.elements.evolutionFX.value,questXpEnabled:f.elements.questXpEnabled.checked,rarityCosts:{...old.rarityCosts}};
 if(f.elements.rareCost.value)next.rarityCosts.rare=Number(f.elements.rareCost.value);else delete next.rarityCosts.rare;
 if(f.elements.legendCost.value)next.rarityCosts.legendary=Number(f.elements.legendCost.value);else delete next.rarityCosts.legendary;
 const specs=String(f.elements.speciesCosts.value||'').trim();next.speciesCosts={};
 if(specs){for(const item of specs.split(',')){const m=item.trim().match(/^(\d{1,3})\s*=\s*(\d{1,5})$/);if(!m||Number(m[1])<1||Number(m[1])>151||Number(m[2])<10||Number(m[2])>10000)return alert('포켓몬별 비용은 예: 7=150,25=200 형식으로 10~10000P를 입력하세요.');next.speciesCosts[m[1]]=Number(m[2]);}}
 if(next.specialLevels.some((x,i)=>!Number.isInteger(x)||x<2||x>100||(i>0&&x<=next.specialLevels[i-1])))return alert('특별 진화 기준은 2~100 사이에서 1차 < 2차 < 3차 순서로 입력하세요.');
 const cleaned=cleanTrainingRules(next);if(cleaned.maxLevel<cleaned.startLevel)return alert('최대 레벨은 시작 레벨 이상이어야 합니다.');
 // Preserve each individual level and relative XP progress when the global XP target changes.
 if(old.xpPerLevel!==cleaned.xpPerLevel){for(const u of Object.values(registry.users)){ensureTrainingProfile(u.data);for(const m of u.data.pokemonRoster){m.xp=Math.min(cleaned.xpPerLevel-1,Math.max(0,Math.round(m.xp/old.xpPerLevel*cleaned.xpPerLevel)));}bumpVersion(u);}}
 data.rules.training=cleaned;bumpRulesVersion();saveRegistry();render();alert('트레이닝 설정을 저장했습니다.');}
function resetTrainingSettings(){const f=document.querySelector('#m-training form');if(!f)return;const d=TRAINING_DEFAULT_RULES();for(const k of ['xpPerLevel','pointCost','startLevel','maxLevel'])f.elements[k].value=d[k];for(const k of ['enabled','autoEvolve','questXpEnabled'])f.elements[k].checked=d[k];f.elements.mode.value=d.mode;for(let i=0;i<3;i++)f.elements['specialLevel'+(i+1)].value=d.specialLevels[i];f.elements.evolutionFX.value=d.evolutionFX;f.elements.rareCost.value='';f.elements.legendCost.value='';f.elements.speciesCosts.value='';}

const beforeTrainingAwardQuestXp=awardQuestXp;
awardQuestXp=function(xp){
 lastTrainingQuestBonus=null;const reached=beforeTrainingAwardQuestXp(xp),rules=trainingRules();
 if(!rules.enabled||!rules.questXpEnabled)return reached;
 const mon=currentBuddy();if(!mon)return reached;
 const max=Math.max(0,(rules.maxLevel-mon.level)*rules.xpPerLevel-mon.xp),gain=Math.min(max,boundedNumber(xp,10000));if(!gain)return reached;
 const old=mon.level,total=mon.xp+gain;mon.level=Math.min(rules.maxLevel,mon.level+Math.floor(total/rules.xpPerLevel));mon.xp=mon.level>=rules.maxLevel?0:total%rules.xpPerLevel;
 lastTrainingQuestBonus={species:mon.species,xp:gain};recordTraining({type:'train',uid:mon.uid,species:mon.species,points:0,xp:gain,level:mon.level});
 earnTrainingBadge('firstTrain',mon.uid);if(old<10&&mon.level>=10)earnTrainingBadge('lv10',mon.uid);if(old<100&&mon.level>=100)earnTrainingBadge('lv100',mon.uid);
 if(rules.autoEvolve){const options=trainEvolutionOptions(mon);if(options.length===1&&options[0].kind==='level')trainingPerformEvolution(mon,options[0].to);}
 return reached;
};

const MOVE_CINEMA_MANUAL=`<section class="manual-section"><h3>⚡ v1.7.39 · 포켓몬별 기술 획득 및 진화 연출</h3><p>기술 획득 조건은 트레이너 레벨이 아닌 <b>현재 보유 중인 포켓몬 개체의 레벨</b>입니다. 같은 종류의 포켓몬도 개체마다 기술 획득 기록이 다릅니다. 도감의 기술 탭에서 2마리 이상이면 확인할 개체를 직접 선택합니다. 필요 레벨 전에는 기술명·정보를 숨기고 <b>Lv.N에 획득</b>만 표시합니다. 해당 포켓몬이 레벨에 도달한 뒤 도감을 열면 <b>새로운 기술 획득</b> 안내가 한 번 표시되고, 확인을 누르면 개체별로 기록됩니다. 이전 버전의 트레이너 기술 기록은 보관하지만 개체별로 자동 지급하지 않아 성장 규칙을 공정하게 유지합니다.</p><p><b>기술 시연:</b> 획득한 기술에만 ▶ 기술 사용 보기 버튼이 나타납니다. 재생 가능한 89개 기술은 전용 또는 기술군별 Canvas 애니메이션을 사용합니다. 다른 기술은 시연 버튼을 숨기며, 실제 게임 영상을 재생하지 않습니다. 재생은 무료이며 포인트·XP를 변경하지 않습니다. 처음 기술을 획득하면 시연이 준비된 기술만 자동으로 재생하며, 시연이 없는 기술은 획득 기록만 표시합니다.</p><p><b>진화:</b> 기존 진화·등록·저장 계산을 먼저 완료하고, 5초 정도의 실루엣·빛·새 모습 공개 효과를 재생합니다. 연출 건너뛰기 기능이 있고 관리자 진화 연출 설정(간단/보통/화려하게)과 기기 움직임 줄이기 설정을 존중합니다. 도감 기록 및 진화 앨범은 그대로 유지됩니다. 기술 데이터는 PokéAPI에서 로딩하며 연결이 안 되면 기존 캐시를 이용합니다.</p></section>`;
const HONOR_MANUAL=`<section class="manual-section"><h3>🏅 v1.7.39 · 트레이너 훈장·보상</h3><p>오늘 탭에서는 이름 옆에 획득 훈장 3개를 직접 선택한 순서대로 컴팩트하게 표시합니다. 모든 훈장 아이콘에는 밑줄이나 원형 강조 배경을 붙이지 않습니다. +N은 더 많은 획득 훈장이 있다는 뜻입니다. 오른쪽 🏆 전체 훈장함 버튼을 눌러 일반 6개 분야와 특별 4종의 전체 훈장·미획득 잠금·달성 조건을 확인하고, 훈장함의 전시 훈장 설정에서 1~3번 칸에 표시할 훈장을 선택하고 위·아래 버튼으로 순서를 변경할 수 있습니다. 이름 아래에는 획득 훈장 수와 활성 부스트만 한 줄로 요약합니다.</p><p><b>일반 훈장 달성 기준 (누적)</b>: 초기 기본값은 훈련 5/20/50/150/400회, 성장(포켓몬 최고 레벨) 15/25/40/60/100레벨, 연속(최장 퀘스트 수행 일수) 5/10/21/45/120일, 수집 10/25/50/85/130종, 진화 3/7/15/30/60회, 기술 5/12/25/50/90개입니다. <b>관리자 → 일반 훈장 달성 기준 설정</b>에서 모든 분야·등급의 실제 기준을 바꿀 수 있습니다. 순서대로 🥉 브론즈/🥈 실버/🥇 골드/💎 플래티넘/👑 마스터입니다. 전체 훈장함에서 해당 분야를 누르면 현재 실적, 보유 등급, 다음 목표, 남은 수량, 전체 등급표를 확인할 수 있습니다.</p><p><b>일반 훈장</b>은 각 분야별 브론즈·실버·골드·플래티넘·마스터 승급입니다. 등급별 추가 P/XP: 5%, 8%, 12%, 15%, 20%. 새 훈장 획득이나 등급 상승 시 48시간 동안 한정 부스트가 적용되고, 기간 중 재획득하면 최고 비율을 유지하며 48시간을 새로 시작합니다. 서로 다른 일반 훈장의 한정 부스트는 합산하지 않습니다. 오늘 탭 이름 아래의 ⚡ 한정 보너스(또는 전체 훈장함 → 산정 근거)를 누르면 현재 적용률, 최근 갱신 분야, 시작/만료 시각, 등급별 비율을 확인할 수 있습니다. 최근 갱신 분야는 기존에 유효한 높은 비율의 원인과 다를 수 있습니다.</p><p><b>특별 훈장</b>은 무지개(불꽃/물/풀/전기/에스퍼/바위 6계열 수집 +2%), 진화의 정점(최종 진화 10종 +3%), 꺼지지 않는 불꽃(최고 연속 수행 30일 +4%), 마스터(6개 일반 분야 골드 이상 +5%)로 영구 합산됩니다. 특별 부스트 상한은 +15%입니다. 퀘스트 보상은 시간·연속·추천·Fever 계산을 마친 뒤 (1+전체 훈장 추가율/100)을 각각 곱해 반올림합니다. 완료 시 새로 얻은 훈장은 <b>다음 퀘스트부터</b> 적용됩니다. 포인트로 구매하는 포켓몬 트레이닝 XP와 하루 전체 완료 보너스에는 적용하지 않습니다.</p><p>기존 획득 훈장도 예외 없이 관리자 현재 기준으로 다시 판정합니다. 기준 미달 훈장은 회수하며, 훈련·퀘스트 활동 기록은 보존합니다. 기준 변경 시 기존 48시간 부스트는 종료하고, 과거 실적을 통한 재획득으로 새 48시간 부스트가 발동하지 않습니다. 훈장, 3칸 전시 선택 및 순서, 종료 시각은 각 트레이너 데이터와 JSON 백업에 저장됩니다.</p></section>`;
const TRAINING_MANUAL=`<section class="manual-section"><h3>🏋️ v1.7.21 · 포켓몬별 성장·진화·대표 포켓몬·이정표</h3><p>트레이너 XP와 포켓몬 XP는 서로 다릅니다. 포켓몬 한 마리마다 고유 ID, 현재 모습, 레벨, 경험치, 획득일 및 진화 기록을 보관합니다. 기본값은 <b>포켓몬 1레벨 = 100XP = 100P</b>이며 트레이닝 버튼(10/50/100XP 및 직접 지정)으로 성장합니다. 실제 포인트 차감액 = <b>ceil(획득 XP × 적용 레벨당 포인트 / 레벨당 XP)</b>. 100XP가 쌓일 때마다 레벨이 오르고 남는 XP는 다음 레벨로 이월됩니다. 한 번에 최대 1,000XP를 지정할 수 있습니다. 최대 포켓몬 레벨은 기본 100입니다.</p><p><b>진화:</b> 관동 151종 내 경로 중 레벨 진화는 기본 자동(관리자 OFF 가능)이며, 이브이처럼 분기 경로는 직접 선택합니다. 돌·교환 등 특별 조건 진화는 기본 간편 모드에서 관리자 지정 단계별 레벨(첫 번째 Lv.25, 두 번째 Lv.40, 세 번째 Lv.55)에 도달하면 선택할 수 있습니다. 특별 진화 횟수는 포켓몬 개체의 진화 기록에서 계산하며, 일반 레벨 진화는 그 횟수에 넣지 않습니다. 늦게 특별 진화한 경우에는 다음 단계까지 추가 레벨 성장이 필요하므로 같은 레벨에서 두 번 연속 특별 진화할 수 없습니다. 단계별 기준은 관리자 모드에서 변경할 수 있고, 기존 단일 특별 진화 기준 설정은 첫 단계로 이어받습니다. 원작 조건 안내 모드에서는 관리자가 PIN으로 별도 승인합니다. 포켓몬의 레벨·XP·개체 ID는 진화 후에도 유지되고, 새 모습은 도감에 등록되며 이전 모습의 도감 기록도 보존됩니다. 151종 밖의 진화는 이번 버전에서 처리하지 않습니다.</p><p><b>대표 포켓몬:</b> 현재 보유한 한 마리를 대표로 지정하면 오늘 탭에서 응원하며, 이벤트 퀘스트에서도 45%의 우선 등장 기회가 있습니다(나머지는 보유 개체 중 고유 종을 균등 추첨). 관리자 설정을 켜면 완료 퀘스트 XP도 대표 포켓몬에게 무료로 지급합니다. <b>성장 이정표:</b> 첫 트레이닝, Lv.10, 첫 진화, 최종 진화, Lv.100 달성 기록 5개를 성장·진화 앨범에 통합해 보여 줍니다. 기존 달성 날짜와 포켓몬 개체 ID는 보존되며, 기록을 누르면 상세 정보를 확인할 수 있습니다. 추가 포인트 보상은 없습니다. <b>앨범:</b> 트레이닝 비용과 XP, 진화 전후 모습을 날짜순으로 저장합니다. 모든 개체·설정·앨범은 기존 전체 JSON Save/Load에 포함됩니다.</p><p><b>나의 포켓몬 보기:</b> 훈련 탭에서 1열·2열·3열·4열·자동 보기를 선택할 수 있습니다. 자동은 목록 너비에 따라 2~4열로 조정됩니다. 보기 설정은 이 기기 브라우저에만 저장되고 JSON 백업으로는 이전되지 않습니다. 도감에서 트레이닝으로 이동하거나 목록에서 포켓몬을 고르면 「선택된 포켓몬 상세·트레이닝」 카드의 맨 위로 이동합니다. 목록 보기 열 수를 변경한 경우에만 「나의 포켓몬」 목록 시작 위치를 보여줍니다.</p><p><b>주의:</b> 게임을 업데이트하기 전 포획 기록은 포켓몬별 획득 횟수만 있기 때문에 그 수만큼 Lv.1 개체로 이전됩니다. 4,000마리 보관 제한과 3,000건 앨범 제한이 있습니다. 관리자 초기화 버튼은 설정 입력만 복원하고 확인을 누르기 전에는 저장되지 않습니다. 본 기능은 공식 포켓몬 레벨 경험치 규칙이 아닌 PokéRoutine 전용 게임 규칙입니다.</p></section>`;

// v1.7.39: update just the saying at each local hour while the app is open.
let lastGreetingHour=greetingHourIndex();
function updateHourlyGreeting(force=false){
 const currentHour=greetingHourIndex();
 if(!force&&lastGreetingHour===currentHour)return;
 lastGreetingHour=currentHour;
 if(screen!=='home'||!currentUserId||!startUnlocked)return;
 const el=document.querySelector('.home-daily-quote');
 if(!el)return;
 const quote=greetingQuote();
 if(el.textContent!==quote){el.textContent=quote;scheduleDailyQuoteFit();}
}
// A precise foreground timer plus a one-minute fallback for sleeping/background browsers.
function scheduleNextHourlyGreeting(){
 const next=new Date();next.setHours(next.getHours()+1,0,0,0);
 setTimeout(()=>{updateHourlyGreeting(true);scheduleNextHourlyGreeting()},Math.max(100,next.getTime()-Date.now()+80));
}
scheduleNextHourlyGreeting();
setInterval(updateHourlyGreeting,60000);

setInterval(()=>{if(screen==='home'&&currentUserId&&startUnlocked){const nameplate=document.querySelector('.honor-nameplate');if(nameplate)nameplate.outerHTML=honorNameplate()}},60000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden){updateFeverVisual();updateHourlyGreeting(true)}});
// When the app stays open across midnight, refresh the home screen automatically.
// Background tabs may suspend intervals; login and Start also run the same cleanup.
let lastLocalQuestDay=day();
setInterval(()=>{
 const today=day();
 if(today===lastLocalQuestDay)return;
 lastLocalQuestDay=today;
 if(!currentUserId)return;
 closePreviousDayTimer();
 render();
},1000);
window.addEventListener('pageshow',()=>{
 updateHourlyGreeting(true);if(startUnlocked&&currentUserId&&screen==='home'&&!modal&&maybeOpenDailyBriefing())render();
 if(!currentUserId)return;
 if(day()!==lastLocalQuestDay){lastLocalQuestDay=day();closePreviousDayTimer();render();}
});
if(currentUserId&&data.pendingEncounter)openPendingCapture();
else if(currentUserId&&data.activeQuest){modal={type:data.activeQuest.finishedAt?'questVerify':'questTimer',id:data.activeQuest.id};render()}
// If a past roulette was interrupted, its already-awarded result is revealed after returning.
setTimeout(resumeLevelGiftRoulette,180);
// 기존 결과가 있다면 자동 로그인 직후 연출을 이어갑니다.
