function dateKeyFromTime(ts){

 const korean=ts.match(/^(\d{4})\.\s*(\d{1,2})\.\s*(\d{1,2})\./);
 if(korean){const [,y,m,d]=korean;return `${y}-${m.padStart(2,'0')}-${d.padStart(2,'0')}`}
 const parsed=new Date(ts);if(!Number.isNaN(parsed.getTime()))return `${parsed.getFullYear()}-${String(parsed.getMonth()+1).padStart(2,'0')}-${String(parsed.getDate()).padStart(2,'0')}`;
 const iso=ts.match(/^(\d{4}-\d{2}-\d{2})/);return iso?iso[1]:null;
}

}

<section class="section"><div class="section-title"><h2>🎴 최근 뽑기</h2></div>${recent.length?recent.map(x=>`<div class="history"><div class="hleft"><strong>${esc(name(x.id))} <span class="rarity ${x.rarity}">${RN[RARITIES.indexOf(x.rarity)]}</span></strong><small>${esc(x.date)} · ${esc(x.tier)} ${x.caught===false?'· 포획 실패':x.new?'· 첫 발견':'· 중복'}</small></div><div class="hval ${x.caught===false?'outcome-bad':''}">${x.caught===false?'도주 · ':'포획 · '}-${x.price}P</div></div>`).join(''):'<div class="empty">아직 뽑기 기록이 없습니다.<br>포인트를 모아 첫 번째 포켓몬을 만나보세요.</div>'}</section>
<section class="section"><div class="section-title"><h2>📜 퀘스트 수정·삭제 이력</h2></div><div class="info-line">생성·수정·삭제 ${data.questEvents.length}건, 과거 기록은 퀘스트를 삭제해도 보관됩니다.</div>${data.questEvents.slice(-8).reverse().map(e=>`<div class="history"><div class="hleft"><strong>${e.action==='create'?'추가':e.action==='edit'?'수정':'삭제'} · ${esc(e.after?.title||e.before?.title||'퀘스트')}</strong><small>${esc(e.at)} ${e.action==='edit'?` · 이전: ${esc(e.before?.title||'')}`:''}</small></div></div>`).join('')}</section>
<section class="section"><div class="section-title"><h2>💾 데이터 저장 / 불러오기</h2></div>${storageStatus()}${backupButtons()}<p class="backup-hint">Save: 현재 퀘스트·포인트·도감·모든 완료 이력·퀘스트 변경 이력·뽑기 기록을 JSON 파일로 저장합니다.<br>Load: 과거 저장한 JSON 파일을 불러와 현재 기록을 교체합니다. 이전 v0.2/v0.3 백업도 불러올 수 있습니다.<br>휴대폰↔태블릿: 한쪽에서 Save한 JSON을 다른 쪽에서 Load하면 기록을 옮길 수 있습니다. 자동 동기화는 아닙니다.</p><div class="backup-actions"><button class="tinybtn" onclick="resetAll()">⚠️ 전체 초기화</button></div></section>`}

function renderCaptureModal(){const e=modal,phase=capturePhase,final=phase==='success'||phase==='fail';const stageText=phase==='encounter'?'야생 포켓몬이 나타났다!':phase==='flight'?'몬스터볼, 날아가라!':phase==='shake'?'하나… 둘… 셋…!':e.caught?'포획 성공! 도감에 기록했어요!':'앗! 포켓몬이 몬스터볼을 빠져나왔다!';return `<div class="overlay capture-overlay"><div class="capture-modal" role="dialog" aria-modal="true" aria-label="포켓몬 포획 연출"><div class="capture-head"><strong>⚡ 야생 포켓몬 조우 · ${esc(e.tier)}</strong>${!final?`<button onclick="skipCapture()">연출 건너뛰기 »</button>`:'<span class="chip">결과 확정</span>'}</div><div class="capture-arena phase-${phase}" aria-live="polite"><div class="capture-starfield"></div><div class="capture-ground"></div><div class="capture-mon">${art(e.id)}</div><div class="capture-beam"></div><div class="capture-ball"></div><div class="capture-impact"></div><div class="capture-burst"></div><div class="capture-sparks"><i>✦</i><i>✧</i><i>★</i><i>✦</i><i>★</i></div></div><div class="capture-status ${final?(e.caught?'highlight':'outcome-bad'):''}">${phase==='success'?'🎉 ':phase==='fail'?'💥 ':''}${esc(stageText)}</div><p class="capture-tiny">No.${String(e.id).padStart(3,'0')} · ${esc(name(e.id))} · <span class="rarity ${e.rarity}">${RN[RARITIES.indexOf(e.rarity)]}</span><br>포획 성공률 ${e.catchPct}% / 실패율 ${100-e.catchPct}%</p>${final?`<button class="modal-btn" onclick="confirmCapture()">${e.caught?'도감에 등록된 결과 확인':'실패 기록 확인'} · 계속하기</button>`:`<button class="modal-btn secondary" onclick="skipCapture()">바로 결과 확인</button>`}</div></div>`}

function renderModal(){if(!modal)return '';if(modal.type==='adminLogin')return `<div class="overlay" onclick="modal=null;render()"><div class="modal" onclick="event.stopPropagation()"><div class="spark">🔒</div><h2>관리자 모드</h2><p class="modal-sub">관리자만 시스템 매뉴얼과 전체 확률 도감을 볼 수 있습니다.</p><form class="qform" onsubmit="loginAdmin(event)"><label for="adminPassword">관리자 비밀번호</label><input id="adminPassword" class="qentry" type="password" inputmode="numeric" autocomplete="off" maxlength="12" required placeholder="비밀번호 입력"><button type="submit" class="modal-btn">관리자 매뉴얼 열기</button></form><button class="modal-btn secondary" onclick="modal=null;render()">취소</button></div></div>`;if(modal.type==='capture')return renderCaptureModal();if(modal.type==='questEditor'){const old=modal.id?data.quests.find(q=>q.id===modal.id):null;return `<div class="overlay" onclick="modal=null;render()"><div class="modal" onclick="event.stopPropagation()"><h2>${old?'퀘스트 수정':'매일 퀘스트 추가'}</h2><p class="modal-sub">내가 정한 퀘스트만 매일 반복됩니다.</p><form class="qform" onsubmit="saveTask(event)"><label for="questName">퀘스트 이름</label><input class="qentry" id="questName" name="title" type="text" required maxlength="45" placeholder="예: 영어 말하기 10분" value="${old?esc(old.title):''}"><div class="qform-row"><div><label for="qCat">카테고리</label><select class="qentry" id="qCat" name="category">${['영어','한자','운동','독서','업무','기타'].map(c=>`<option value="${c}" ${old?.category===c?'selected':''}>${c}</option>`).join('')}</select></div><div><label for="qMins">목표 시간(분)</label><input class="qentry" id="qMins" name="mins" type="number" min="1" max="999" value="${Number(old?.mins)||10}" required></div></div><p class="qform-note">✓ 매일 동일하게 표시 · 하루 1회 완료 · 항목 간 보상 차등 없음</p><button class="modal-btn" type="submit">${old?'변경사항 저장':'퀘스트 등록'}</button></form>${old?`<button class="modal-btn secondary" onclick="removeTask('${old.id}')">삭제하기</button>`:''}<button class="modal-btn secondary" onclick="modal=null;render()">취소</button></div></div>`}
if(modal.type==='quest')return `<div class="overlay" onclick="modal=null;render()"><div class="modal" onclick="event.stopPropagation()"><div class="spark">✦ ✧ ✦</div><h2>퀘스트 완료!</h2><p class="modal-sub">${esc(modal.title)} · 오늘도 성장 성공</p><div class="modal-art"><div class="pokeball"></div></div><h2 style="color:#ffd46b">+${modal.pts} P</h2><p class="modal-sub">모든 퀘스트 동일 확률: 20/25/30/35/40P 각 20%</p><button class="modal-btn" onclick="modal=null;setScreen('draw')">뽑기하러 가기 →</button><button class="modal-btn secondary" onclick="modal=null;render()">퀘스트 계속하기</button></div></div>`;
if(modal.type==='bonus')return `<div class="overlay" onclick="modal=null;render()"><div class="modal" onclick="event.stopPropagation()"><h2>🎁 체험 보너스!</h2><p class="modal-sub">개발 데모 전용 · 최초 1회</p><div class="modal-art"><div class="pokeball"></div></div><h2 style="color:#ffd46b">+600 P</h2><button class="modal-btn" onclick="modal=null;setScreen('draw')">뽑기 확률 테스트하기 →</button></div></div>`;
const r=modal.rarity;return `<div class="overlay" onclick="modal=null;render()"><div class="modal" onclick="event.stopPropagation()"><div class="spark">✧ ✦ ✧</div><p class="modal-sub">${esc(modal.tier)} · ${modal.caught?modal.new?'새 포켓몬 발견!':'또 만난 포켓몬!':'몬스터볼에서 빠져나갔습니다'}</p><h2 class="rarity ${r}" style="font-size:25px">${RN[RARITIES.indexOf(r)]} · ${esc(name(modal.id))}</h2><div class="modal-art">${art(modal.id)}</div><h2 class="${modal.caught?'highlight':'outcome-bad'}">${modal.caught?'🎉 포획 성공!':'💨 포획 실패!'}</h2><p class="modal-sub">${modal.caught?`No.${String(modal.id).padStart(3,'0')} · ${modal.new?'도감에 처음 등록!':'중복 포획 +1'}`:'이번 도전에서는 도감에 등록되지 않습니다.'}</p><p class="catch-desc">해당 포켓몬 포획 성공률 <b>${modal.catchPct}%</b> · 실패 확률 <b>${100-modal.catchPct}%</b><br>포인트는 성공·실패에 관계없이 지불됩니다.</p><button class="modal-btn" onclick="modal=null;setScreen('${modal.caught?'dex':'stats'}')">${modal.caught?'도감 확인하기':'실패 기록 확인하기'} →</button><button class="modal-btn secondary" onclick="modal=null;render()">확인</button></div></div>`}

render();
if(data.pendingEncounter)openPendingCapture();
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
 window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}
</script></body></html>
